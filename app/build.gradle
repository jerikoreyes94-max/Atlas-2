plugins { id 'com.android.application' }

android {
    namespace 'com.atlas.personalai'
    compileSdk 36

    defaultConfig {
        applicationId 'com.atlas.personalai'
        minSdk 29
        targetSdk 36
        versionCode 700
        versionName '7.0.0'
    }

    signingConfigs {
        atlasPersistent {
            storeFile file("$rootDir/.atlas-signing/atlas.jks")
            storePassword "atlas-local-v5"
            keyAlias "atlas"
            keyPassword "atlas-local-v5"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.atlasPersistent
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
