name: Build Atlas 1.1 Full Core
 
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/Atlas-v5-one-click-build.yml'
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
 
      - name: Restore permanent Atlas signer
        uses: actions/cache/restore@v4
        with:
          path: .atlas-signing/atlas.jks
          key: atlas-personalai-signing-v5-stable
          fail-on-cache-miss: true
 
      - name: Android SDK
        uses: android-actions/setup-android@v3
 
      - name: Install Android 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
 
      - name: Upgrade full Atlas app to 1.1
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/java/com/atlas/personalai/MainActivity.java
          test -f app/src/main/java/com/atlas/personalai/ActionEngine.java
          test -f .atlas-signing/atlas.jks
 
          python3 <<'PYCODE'
          from pathlib import Path
          import re
 
          build = Path('app/build.gradle')
          s = build.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode 1100', s, count=1)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '1.1.0'", s, count=1)
          build.write_text(s)
 
          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android:name=".CoreSettingsActivity"' not in m:
              anchor = '        <activity\n            android:name=".MainActivity"'
              insert = '        <activity android:name=".CoreSettingsActivity" android:exported="false" />\n\n' + anchor
              if anchor not in m:
                  raise SystemExit('MainActivity manifest anchor missing')
              m = m.replace(anchor, insert, 1)
          manifest.write_text(m)
 
          main = Path('app/src/main/java/com/atlas/personalai/MainActivity.java')
          t = main.read_text()
          t = t.replace('ATLAS v7 FULL', 'ATLAS 1.1')
          t = t.replace('Atlas Core URL (optional, e.g. https://...)', 'Custom Atlas Core URL (optional fallback)')
 
          if 'FREE AI CORE SETUP' not in t:
              anchor = '        Button save = button("SAVE CORE URL");\n        save.setOnClickListener(v -> { AtlasStore.setCoreUrl(this, core.getText().toString()); toast("Core URL saved"); });\n        root.addView(save);\n'
              addition = '        Button aiCore = button("FREE AI CORE SETUP");\n        aiCore.setOnClickListener(v -> startActivity(new Intent(this, CoreSettingsActivity.class)));\n        root.addView(aiCore);\n\n        TextView coreState = tv("AI CORE: " + AtlasCore.status(this), 13);\n        root.addView(coreState);\n'
              if anchor not in t:
                  raise SystemExit('Core UI anchor missing')
              t = t.replace(anchor, anchor + '\n' + addition, 1)
 
          if 'low.equals("core status")' not in t:
              anchor = '        if (low.equals("what did i miss") || low.equals("what did i miss?")) { speakReply(notificationSummary(), conversationMode); return; }'
              add = anchor + '\n        if (low.equals("core status") || low.equals("core status?")) { speakReply(AtlasCore.status(this), conversationMode); return; }\n        if (low.equals("setup core") || low.equals("core setup")) { startActivity(new Intent(this, CoreSettingsActivity.class)); speakReply("Opening free AI core setup.", false); return; }'
              if anchor not in t:
                  raise SystemExit('Command anchor missing')
              t = t.replace(anchor, add, 1)
 
          old = '        String base = AtlasStore.coreUrl(this);\n        if (base.isEmpty()) {\n            speakReply("My phone-agent layer is active. I can control apps and the interface, use contacts, calls, texts, media, calendar, location, notifications, camera, flashlight, clipboard, and local memory. Add Atlas Core for general intelligence and multi-step reasoning.", conversationMode);\n            return;\n        }\n        status.setText("THINKING");\n        new Thread(() -> callCore(base, text)).start();\n'
          new = '        if (!AtlasCore.isConfigured(this) && AtlasStore.coreUrl(this).isEmpty()) {\n            speakReply("Atlas 1.1 is ready for a free AI core. Tap Free AI Core Setup and add any OpenRouter, Groq, or Gemini free-tier API key.", conversationMode);\n            return;\n        }\n        status.setText("THINKING - " + AtlasCore.shortStatus(this));\n        new Thread(() -> callCore("", text)).start();\n'
          if old not in t:
              raise SystemExit('Old core-routing block missing')
          t = t.replace(old, new, 1)
 
          start = t.find('    private void callCore(')
          end = t.find('    private String memorySummary()', start)
          if start < 0 or end < 0:
              raise SystemExit('callCore method markers missing')
          replacement = '    private void callCore(String ignored, String text) {\n        try {\n            JSONObject out = AtlasCore.ask(this, text, conversationId);\n            String r = out.optString("reply", "");\n            JSONArray memories = out.optJSONArray("memories");\n            if (memories != null) {\n                for (int i = 0; i < memories.length(); i++) {\n                    String memory = memories.optString(i, "").trim();\n                    if (!memory.isEmpty()) AtlasStore.remember(this, memory);\n                }\n            }\n            JSONArray actions = out.optJSONArray("actions");\n            JSONObject single = out.optJSONObject("action");\n            String provider = out.optString("provider", "core");\n            final String shown = r.isEmpty() ? "Atlas core returned no reply." : r;\n            runOnUiThread(() -> {\n                status.setText("CORE: " + provider.toUpperCase(Locale.US));\n                if (actions != null && actions.length() > 0) {\n                    queuedActions = actions;\n                    runQueuedActions(shown);\n                } else if (single != null) {\n                    routeAction(single, shown);\n                } else {\n                    speakReply(shown, conversationMode);\n                }\n            });\n        } catch (Exception e) {\n            runOnUiThread(() -> speakReply("Core error: " + e.getMessage(), conversationMode));\n        }\n    }\n\n'
          t = t[:start] + replacement + t[end:]
          main.write_text(t)
          PYCODE
 
          cat > app/src/main/java/com/atlas/personalai/SecureStore.java <<'JAVA'
          package com.atlas.personalai;
 
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.util.Base64;
          import java.nio.charset.StandardCharsets;
          import java.security.KeyStore;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;
 
          public final class SecureStore {
              private static final String ALIAS = "atlas_core_v1";
              private static final String PREF = "atlas_secure_core";
              private SecureStore() {}
 
              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }
 
              private static SecretKey key() throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (!ks.containsAlias(ALIAS)) {
                      KeyGenerator kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                      kg.init(new KeyGenParameterSpec.Builder(
                              ALIAS,
                              KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                              .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                              .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                              .setRandomizedEncryptionRequired(true)
                              .build());
                      kg.generateKey();
                  }
                  return ((KeyStore.SecretKeyEntry) ks.getEntry(ALIAS, null)).getSecretKey();
              }
 
              public static void set(Context c, String name, String value) {
                  try {
                      if (value == null || value.trim().isEmpty()) return;
                      Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                      cipher.init(Cipher.ENCRYPT_MODE, key());
                      byte[] enc = cipher.doFinal(value.trim().getBytes(StandardCharsets.UTF_8));
                      String packed = Base64.encodeToString(cipher.getIV(), Base64.NO_WRAP) + ":" +
                              Base64.encodeToString(enc, Base64.NO_WRAP);
                      p(c).edit().putString(name, packed).apply();
                  } catch (Exception e) {
                      throw new RuntimeException("Secure storage failed", e);
                  }
              }
 
              public static String get(Context c, String name) {
                  try {
                      String packed = p(c).getString(name, "");
                      if (packed == null || packed.isEmpty()) return "";
                      String[] parts = packed.split(":", 2);
                      if (parts.length != 2) return "";
                      byte[] iv = Base64.decode(parts[0], Base64.NO_WRAP);
                      byte[] enc = Base64.decode(parts[1], Base64.NO_WRAP);
                      Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                      cipher.init(Cipher.DECRYPT_MODE, key(), new GCMParameterSpec(128, iv));
                      return new String(cipher.doFinal(enc), StandardCharsets.UTF_8);
                  } catch (Exception e) {
                      return "";
                  }
              }
 
              public static boolean has(Context c, String name) {
                  return !get(c, name).isEmpty();
              }
 
              public static void clearCoreKeys(Context c) {
                  p(c).edit().clear().apply();
              }
          }
          JAVA
 
          cat > app/src/main/java/com/atlas/personalai/CoreSettingsActivity.java <<'JAVA'
          package com.atlas.personalai;
 
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONObject;
          import java.util.UUID;
 
          public class CoreSettingsActivity extends Activity {
              private EditText openRouter, groq, gemini;
              private TextView status;
 
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 28, 28, 28);
 
                  TextView title = text("ATLAS 1.1 - FREE AI CORE", 26);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.addView(title);
                  root.addView(text("Add ONE free-tier key. Atlas automatically routes and fails over between configured providers. Keys are encrypted with Android Keystore and are not stored in the GitHub source. Atlas sends sensitive phone context only when your request calls for it.", 15));
 
                  status = text(AtlasCore.status(this), 14);
                  root.addView(status);
 
                  openRouter = secretField("OpenRouter API key" + configured("openrouter_key"));
                  root.addView(openRouter);
                  Button or = button("OPEN OPENROUTER KEY PAGE");
                  or.setOnClickListener(v -> open("https://openrouter.ai/settings/keys"));
                  root.addView(or);
 
                  groq = secretField("Groq API key" + configured("groq_key"));
                  root.addView(groq);
                  Button g = button("OPEN GROQ KEY PAGE");
                  g.setOnClickListener(v -> open("https://console.groq.com/keys"));
                  root.addView(g);
 
                  gemini = secretField("Gemini API key" + configured("gemini_key"));
                  root.addView(gemini);
                  Button gm = button("OPEN GOOGLE AI STUDIO KEY PAGE");
                  gm.setOnClickListener(v -> open("https://aistudio.google.com/apikey"));
                  root.addView(gm);
 
                  Button save = button("SAVE CORE KEYS");
                  save.setOnClickListener(v -> saveKeys());
                  root.addView(save);
 
                  Button test = button("TEST ATLAS CORE");
                  test.setOnClickListener(v -> testCore());
                  root.addView(test);
 
                  Button clear = button("CLEAR ALL CORE KEYS");
                  clear.setOnClickListener(v -> {
                      SecureStore.clearCoreKeys(this);
                      toast("Core keys cleared");
                      status.setText(AtlasCore.status(this));
                  });
                  root.addView(clear);
 
                  root.addView(text("AUTO ROUTER: questions needing fresh web information prefer Groq Compound when configured. General reasoning prefers OpenRouter's free-model router. Gemini Gemma 4 is another free fallback. Your existing custom Atlas Core URL remains a final fallback.", 14));
 
                  Button back = button("BACK TO ATLAS");
                  back.setOnClickListener(v -> finish());
                  root.addView(back);
 
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);
              }
 
              private String configured(String key) {
                  return SecureStore.has(this, key) ? " - CONFIGURED (leave blank to keep)" : "";
              }
 
              private EditText secretField(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setSingleLine(true);
                  e.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  e.setPadding(12, 18, 12, 18);
                  return e;
              }
 
              private TextView text(String s, int size) {
                  TextView t = new TextView(this);
                  t.setText(s); t.setTextSize(size); t.setPadding(12, 12, 12, 12);
                  return t;
              }
 
              private Button button(String s) {
                  Button b = new Button(this); b.setText(s); return b;
              }
 
              private void saveKeys() {
                  String o = openRouter.getText().toString().trim();
                  String g = groq.getText().toString().trim();
                  String m = gemini.getText().toString().trim();
                  if (!o.isEmpty()) SecureStore.set(this, "openrouter_key", o);
                  if (!g.isEmpty()) SecureStore.set(this, "groq_key", g);
                  if (!m.isEmpty()) SecureStore.set(this, "gemini_key", m);
                  openRouter.setText(""); groq.setText(""); gemini.setText("");
                  status.setText(AtlasCore.status(this));
                  toast("Atlas core settings saved");
              }
 
              private void testCore() {
                  saveKeys();
                  if (!AtlasCore.isConfigured(this) && AtlasStore.coreUrl(this).isEmpty()) {
                      toast("Add at least one key first"); return;
                  }
                  status.setText("Testing core...");
                  new Thread(() -> {
                      try {
                          JSONObject r = AtlasCore.ask(this,
                                  "This is a core connection test. Reply briefly that Atlas core is online. Do not run any phone action.",
                                  UUID.randomUUID().toString());
                          String provider = r.optString("provider", "core");
                          String reply = r.optString("reply", "online");
                          runOnUiThread(() -> status.setText("ONLINE via " + provider + " - " + reply));
                      } catch (Exception e) {
                          runOnUiThread(() -> status.setText("TEST FAILED - " + e.getMessage()));
                      }
                  }).start();
              }
 
              private void open(String url) {
                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
                  catch (Exception e) { toast("Could not open browser"); }
              }
 
              private void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }
          }
          JAVA
 
          cat > app/src/main/java/com/atlas/personalai/AtlasCore.java <<'JAVA'
          package com.atlas.personalai;
 
          import android.content.Context;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
 
          public final class AtlasCore {
              private AtlasCore() {}
 
              public static boolean isConfigured(Context c) {
                  return SecureStore.has(c, "openrouter_key") ||
                          SecureStore.has(c, "groq_key") ||
                          SecureStore.has(c, "gemini_key");
              }
 
              public static String shortStatus(Context c) {
                  if (SecureStore.has(c, "groq_key")) return "GROQ/WEB";
                  if (SecureStore.has(c, "openrouter_key")) return "OPENROUTER FREE";
                  if (SecureStore.has(c, "gemini_key")) return "GEMINI FREE";
                  if (!AtlasStore.coreUrl(c).isEmpty()) return "CUSTOM CORE";
                  return "NO CORE";
              }
 
              public static String status(Context c) {
                  List<String> x = new ArrayList<>();
                  if (SecureStore.has(c, "openrouter_key")) x.add("OpenRouter free configured");
                  if (SecureStore.has(c, "groq_key")) x.add("Groq free configured");
                  if (SecureStore.has(c, "gemini_key")) x.add("Gemini free configured");
                  if (!AtlasStore.coreUrl(c).isEmpty()) x.add("custom Core URL configured");
                  if (x.isEmpty()) return "AI core not configured yet.";
                  return "AI core ready: " + String.join(" | ", x);
              }
 
              public static JSONObject ask(Context c, String text, String conversationId) throws Exception {
                  List<String> errors = new ArrayList<>();
                  boolean web = needsFreshWeb(text);
 
                  if (web && SecureStore.has(c, "groq_key")) {
                      try { return normalize(callGroq(c, text, conversationId), "groq-compound"); }
                      catch (Exception e) { errors.add("Groq: " + shortError(e)); }
                  }
                  if (SecureStore.has(c, "openrouter_key")) {
                      try { return normalize(callOpenRouter(c, text, conversationId), "openrouter-free"); }
                      catch (Exception e) { errors.add("OpenRouter: " + shortError(e)); }
                  }
                  if (!web && SecureStore.has(c, "groq_key")) {
                      try { return normalize(callGroq(c, text, conversationId), "groq-compound"); }
                      catch (Exception e) { errors.add("Groq: " + shortError(e)); }
                  }
                  if (SecureStore.has(c, "gemini_key")) {
                      try { return normalize(callGemini(c, text, conversationId), "gemini-gemma4"); }
                      catch (Exception e) { errors.add("Gemini: " + shortError(e)); }
                  }
                  if (!AtlasStore.coreUrl(c).isEmpty()) {
                      try { return callCustomCore(c, text, conversationId); }
                      catch (Exception e) { errors.add("Custom: " + shortError(e)); }
                  }
                  if (errors.isEmpty()) throw new Exception("No AI core configured. Open Free AI Core Setup and add one free-tier key.");
                  throw new Exception("All configured cores failed. " + String.join(" | ", errors));
              }
 
              private static boolean needsFreshWeb(String text) {
                  String s = text == null ? "" : text.toLowerCase(Locale.US);
                  String[] hints = {"today", "latest", "current", "news", "weather", "score", "price", "open now", "right now", "this week", "search the web", "look online", "find online"};
                  for (String h : hints) if (s.contains(h)) return true;
                  return false;
              }
 
              private static String callOpenRouter(Context c, String text, String conversationId) throws Exception {
                  JSONObject body = openAiBody(c, text, conversationId, "openrouter/free");
                  HttpURLConnection h = connection("https://openrouter.ai/api/v1/chat/completions");
                  h.setRequestProperty("Authorization", "Bearer " + SecureStore.get(c, "openrouter_key"));
                  h.setRequestProperty("HTTP-Referer", "https://github.com/jerikoreyes94-max/Atlas-2");
                  h.setRequestProperty("X-Title", "Atlas Personal AI");
                  String raw = post(h, body.toString());
                  JSONObject o = new JSONObject(raw);
                  return o.getJSONArray("choices").getJSONObject(0).getJSONObject("message").optString("content", "");
              }
 
              private static String callGroq(Context c, String text, String conversationId) throws Exception {
                  JSONObject body = openAiBody(c, text, conversationId, "groq/compound");
                  HttpURLConnection h = connection("https://api.groq.com/openai/v1/chat/completions");
                  h.setRequestProperty("Authorization", "Bearer " + SecureStore.get(c, "groq_key"));
                  String raw = post(h, body.toString());
                  JSONObject o = new JSONObject(raw);
                  return o.getJSONArray("choices").getJSONObject(0).getJSONObject("message").optString("content", "");
              }
 
              private static String callGemini(Context c, String text, String conversationId) throws Exception {
                  String key = URLEncoder.encode(SecureStore.get(c, "gemini_key"), StandardCharsets.UTF_8.toString());
                  String endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemma-4-26b-a4b-it:generateContent?key=" + key;
                  JSONObject body = new JSONObject();
                  JSONArray contents = new JSONArray();
                  JSONObject content = new JSONObject();
                  JSONArray parts = new JSONArray();
                  JSONObject part = new JSONObject();
                  part.put("text", systemPrompt() + "\n\nPHONE_CONTEXT:\n" + context(c, conversationId, text).toString() + "\n\nUSER REQUEST:\n" + text);
                  parts.put(part); content.put("parts", parts); contents.put(content); body.put("contents", contents);
                  JSONObject config = new JSONObject();
                  config.put("temperature", 0.25);
                  config.put("maxOutputTokens", 1600);
                  body.put("generationConfig", config);
                  HttpURLConnection h = connection(endpoint);
                  String raw = post(h, body.toString());
                  JSONObject o = new JSONObject(raw);
                  return o.getJSONArray("candidates").getJSONObject(0)
                          .getJSONObject("content").getJSONArray("parts").getJSONObject(0).optString("text", "");
              }
 
              private static JSONObject callCustomCore(Context c, String text, String conversationId) throws Exception {
                  String base = AtlasStore.coreUrl(c);
                  String endpoint = base.endsWith("/") ? base + "api/chat" : base + "/api/chat";
                  JSONObject body = new JSONObject();
                  body.put("text", text);
                  body.put("device", "Titan 2");
                  body.put("source", "voice_or_text");
                  body.put("conversationId", conversationId);
                  body.put("context", context(c, conversationId, text));
                  HttpURLConnection h = connection(endpoint);
                  String raw = post(h, body.toString());
                  JSONObject out = new JSONObject(raw);
                  out.put("provider", "custom-core");
                  if (!out.has("actions")) out.put("actions", new JSONArray());
                  return out;
              }
 
              private static JSONObject openAiBody(Context c, String text, String conversationId, String model) throws Exception {
                  JSONObject body = new JSONObject();
                  body.put("model", model);
                  body.put("temperature", 0.25);
                  body.put("max_tokens", 1600);
                  JSONArray messages = new JSONArray();
                  messages.put(message("system", systemPrompt()));
                  messages.put(message("user", "PHONE_CONTEXT:\n" + context(c, conversationId, text).toString() + "\n\nUSER REQUEST:\n" + text));
                  body.put("messages", messages);
                  return body;
              }
 
              private static JSONObject message(String role, String content) throws Exception {
                  JSONObject m = new JSONObject(); m.put("role", role); m.put("content", content); return m;
              }
 
              private static JSONObject context(Context c, String conversationId, String request) {
                  JSONObject x = new JSONObject();
                  try {
                      String q = request == null ? "" : request.toLowerCase(Locale.US);
                      boolean needMessages = containsAny(q, "text", "sms", "message", "messages");
                      boolean needNotifications = containsAny(q, "notification", "notifications", "missed", "what did i miss");
                      boolean needCalendar = containsAny(q, "calendar", "schedule", "appointment", "meeting", "event");
                      boolean needLocation = containsAny(q, "where am i", "near me", "nearby", "navigate", "directions", "weather", "location");
                      x.put("conversationId", conversationId);
                      x.put("timeMillis", System.currentTimeMillis());
                      JSONObject device = DeviceContext.snapshot(c);
                      if (!needLocation) device.remove("location");
                      x.put("device", device);
                      x.put("capabilities", CapabilityManager.snapshot(c));
                      x.put("memories", tail(AtlasStore.memories(c), 40));
                      x.put("recentConversation", tail(AtlasStore.conversation(c), 18));
                      if (needNotifications) x.put("recentNotifications", tail(AtlasStore.notifications(c), 24));
                      if (needCalendar) x.put("upcomingCalendar", CalendarTools.upcoming(c));
                      if (needMessages) x.put("recentSms", SmsTools.recent(c));
                  } catch (Exception ignored) {}
                  return x;
              }
 
              private static boolean containsAny(String s, String... terms) {
                  for (String t : terms) if (s.contains(t)) return true;
                  return false;
              }
 
              private static JSONArray tail(JSONArray a, int max) {
                  JSONArray out = new JSONArray();
                  if (a == null) return out;
                  int start = Math.max(0, a.length() - max);
                  for (int i = start; i < a.length(); i++) out.put(a.opt(i));
                  return out;
              }
 
              private static String systemPrompt() {
                  return "You are Atlas, the user's personal Android AI agent. Think carefully, be concise in speech, use the supplied phone context, and never invent device state. " +
                          "You can request phone actions, but the Android app enforces permissions and confirmation for risky actions. " +
                          "Return ONLY one valid JSON object and no markdown. Schema: " +
                          "{\"reply\":\"natural spoken answer\",\"actions\":[{\"type\":\"action_name\", ...}],\"memories\":[\"durable user facts/preferences worth remembering\"]}. " +
                          "Use an empty actions array when no phone action is needed. Use memories only for durable facts, not temporary chatter. " +
                          "Supported action types include: open_app, navigate, web_search, get_location, call_contact, dial_number, send_sms, read_sms, create_calendar_event, " +
                          "media_play, media_pause, media_next, media_previous, volume_up, volume_down, flashlight_on, flashlight_off, open_camera, clipboard_copy, clipboard_read, " +
                          "answer_call, end_call, ui_back, ui_home, ui_recents, ui_notifications, ui_quick_settings, ui_scroll_down, ui_scroll_up, ui_swipe_up, ui_swipe_down, " +
                          "ui_swipe_left, ui_swipe_right, ui_click_text, ui_type_text, ui_screenshot, ui_lock_screen. " +
                          "For multi-step tasks, return actions in execution order. Do not claim an action succeeded before the phone reports the result. " +
                          "If an action requires missing details, ask the user instead of guessing. For ordinary questions, answer directly without an action.";
              }
 
              private static JSONObject normalize(String raw, String provider) throws Exception {
                  String s = raw == null ? "" : raw.trim();
                  if (s.startsWith("```")) {
                      int nl = s.indexOf('\n');
                      if (nl >= 0) s = s.substring(nl + 1);
                      if (s.endsWith("```")) s = s.substring(0, s.length() - 3).trim();
                  }
                  int a = s.indexOf('{');
                  int b = s.lastIndexOf('}');
                  JSONObject out;
                  if (a >= 0 && b > a) {
                      try { out = new JSONObject(s.substring(a, b + 1)); }
                      catch (Exception e) { out = new JSONObject().put("reply", s); }
                  } else {
                      out = new JSONObject().put("reply", s);
                  }
                  if (!out.has("reply")) out.put("reply", "Done.");
                  if (!out.has("actions")) out.put("actions", new JSONArray());
                  if (!out.has("memories")) out.put("memories", new JSONArray());
                  out.put("provider", provider);
                  return out;
              }
 
              private static HttpURLConnection connection(String endpoint) throws Exception {
                  HttpURLConnection h = (HttpURLConnection) new URL(endpoint).openConnection();
                  h.setConnectTimeout(15000);
                  h.setReadTimeout(60000);
                  h.setRequestMethod("POST");
                  h.setDoOutput(true);
                  h.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                  h.setRequestProperty("Accept", "application/json");
                  return h;
              }
 
              private static String post(HttpURLConnection h, String json) throws Exception {
                  byte[] bytes = json.getBytes(StandardCharsets.UTF_8);
                  try (OutputStream os = h.getOutputStream()) { os.write(bytes); }
                  int code = h.getResponseCode();
                  InputStream in = code >= 200 && code < 300 ? h.getInputStream() : h.getErrorStream();
                  String body = readAll(in);
                  h.disconnect();
                  if (code < 200 || code >= 300) throw new Exception("HTTP " + code + " " + trim(body, 240));
                  return body;
              }
 
              private static String readAll(InputStream in) throws Exception {
                  if (in == null) return "";
                  BufferedReader br = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8));
                  StringBuilder sb = new StringBuilder(); String line;
                  while ((line = br.readLine()) != null) sb.append(line);
                  return sb.toString();
              }
 
              private static String trim(String s, int n) {
                  if (s == null) return "";
                  s = s.replace('\n', ' ').replace('\r', ' ').trim();
                  return s.length() <= n ? s : s.substring(0, n);
              }
 
              private static String shortError(Exception e) {
                  return trim(e == null ? "unknown" : String.valueOf(e.getMessage()), 180);
              }
