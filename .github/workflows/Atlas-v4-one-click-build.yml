name: Build Atlas v4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Keep Atlas signing key stable from v4 onward
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: atlas-personalai-debug-signing-v4

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create Atlas v4 project
        shell: bash
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/atlas/personalai app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AtlasV4"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.atlas.personalai'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.atlas.personalai'
                  minSdk 29
                  targetSdk 36
                  versionCode 400
                  versionName '4.0.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Atlas</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/voice_interaction_service.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <voice-interaction-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:sessionService="com.atlas.personalai.AtlasVoiceInteractionSessionService"
              android:supportsAssist="true"
              android:supportsLaunchVoiceAssistFromKeyguard="true" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Atlas"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AtlasNotificationListener"
                      android:label="Atlas Notification Access"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".AtlasForegroundService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />

                  <service
                      android:name=".AtlasVoiceInteractionService"
                      android:label="Atlas"
                      android:permission="android.permission.BIND_VOICE_INTERACTION"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.voice.VoiceInteractionService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.voice_interaction"
                          android:resource="@xml/voice_interaction_service" />
                  </service>

                  <service
                      android:name=".AtlasVoiceInteractionSessionService"
                      android:permission="android.permission.BIND_VOICE_INTERACTION"
                      android:exported="true" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasStore.java <<'EOF'
          package com.atlas.personalai;

          import android.content.Context;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public final class AtlasStore {
              private static final String PREF = "atlas_v4";
              private AtlasStore() {}

              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }

              public static String coreUrl(Context c) {
                  return p(c).getString("core_url", "").trim();
              }

              public static void setCoreUrl(Context c, String s) {
                  p(c).edit().putString("core_url", s == null ? "" : s.trim()).apply();
              }

              public static String voiceName(Context c) {
                  return p(c).getString("voice_name", "");
              }

              public static void setVoiceName(Context c, String s) {
                  p(c).edit().putString("voice_name", s == null ? "" : s).apply();
              }

              public static float speechRate(Context c) {
                  return p(c).getFloat("speech_rate", 0.93f);
              }

              public static void setSpeechRate(Context c, float v) {
                  p(c).edit().putFloat("speech_rate", v).apply();
              }

              public static float pitch(Context c) {
                  return p(c).getFloat("pitch", 0.97f);
              }

              public static void setPitch(Context c, float v) {
                  p(c).edit().putFloat("pitch", v).apply();
              }

              public static boolean conversationMode(Context c) {
                  return p(c).getBoolean("conversation_mode", true);
              }

              public static void setConversationMode(Context c, boolean v) {
                  p(c).edit().putBoolean("conversation_mode", v).apply();
              }

              public static JSONArray memories(Context c) {
                  try {
                      return new JSONArray(p(c).getString("memories", "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              public static void remember(Context c, String text) {
                  JSONArray a = memories(c);
                  a.put(text);
                  while (a.length() > 75) a.remove(0);
                  p(c).edit().putString("memories", a.toString()).apply();
              }

              public static JSONArray notifications(Context c) {
                  try {
                      return new JSONArray(p(c).getString("notifications", "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              public static void addNotification(Context c, String text) {
                  JSONArray a = notifications(c);
                  a.put(text);
                  while (a.length() > 100) a.remove(0);
                  p(c).edit().putString("notifications", a.toString()).apply();
              }

              public static JSONArray conversation(Context c) {
                  try {
                      return new JSONArray(p(c).getString("conversation", "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              public static void addTurn(Context c, String role, String text) {
                  try {
                      JSONArray a = conversation(c);
                      JSONObject o = new JSONObject();
                      o.put("role", role);
                      o.put("text", text);
                      o.put("time", System.currentTimeMillis());
                      a.put(o);
                      while (a.length() > 30) a.remove(0);
                      p(c).edit().putString("conversation", a.toString()).apply();
                  } catch (Exception ignored) {}
              }

              public static void clearConversation(Context c) {
                  p(c).edit().putString("conversation", "[]").apply();
              }
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasNotificationListener.java <<'EOF'
          package com.atlas.personalai;

          import android.app.Notification;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          public class AtlasNotificationListener extends NotificationListenerService {
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  try {
                      Notification n = sbn.getNotification();
                      CharSequence title = n.extras.getCharSequence(Notification.EXTRA_TITLE, "");
                      CharSequence text = n.extras.getCharSequence(Notification.EXTRA_TEXT, "");
                      AtlasStore.addNotification(
                          this,
                          sbn.getPackageName() + " | " + title + " | " + text
                      );
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasForegroundService.java <<'EOF'
          package com.atlas.personalai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.IBinder;

          public class AtlasForegroundService extends Service {
              private static final String CH = "atlas_core";

              @Override
              public void onCreate() {
                  super.onCreate();

                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(
                      new NotificationChannel(
                          CH,
                          "Atlas Core",
                          NotificationManager.IMPORTANCE_LOW
                      )
                  );

                  Notification n = new Notification.Builder(this, CH)
                      .setContentTitle("Atlas v4 is active")
                      .setContentText("Voice + Brain + conversation mode")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build();

                  startForeground(400, n);
              }

              @Override
              public int onStartCommand(Intent i, int flags, int id) {
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasVoiceInteractionService.java <<'EOF'
          package com.atlas.personalai;

          import android.service.voice.VoiceInteractionService;

          public class AtlasVoiceInteractionService extends VoiceInteractionService {
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasVoiceInteractionSessionService.java <<'EOF'
