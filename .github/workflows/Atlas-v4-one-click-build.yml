          import android.service.voice.VoiceInteractionSession;
          import android.service.voice.VoiceInteractionSessionService;

          public class AtlasVoiceInteractionSessionService extends VoiceInteractionSessionService {
              @Override
              public VoiceInteractionSession onNewSession(android.os.Bundle args) {
                  return new AtlasVoiceInteractionSession(this);
              }
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasVoiceInteractionSession.java <<'EOF'
          package com.atlas.personalai;

          import android.content.Context;
          import android.content.Intent;
          import android.service.voice.VoiceInteractionSession;

          public class AtlasVoiceInteractionSession extends VoiceInteractionSession {
              public AtlasVoiceInteractionSession(Context c) {
                  super(c);
              }

              @Override
              public void onShow(android.os.Bundle args, int flags) {
                  super.onShow(args, flags);

                  try {
                      Intent i = new Intent(getContext(), MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      i.putExtra("atlas_auto_listen", true);
                      getContext().startActivity(i);
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/MainActivity.java <<'EOF'
          package com.atlas.personalai;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Typeface;
          import android.media.AudioAttributes;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.UUID;

          public class MainActivity extends Activity implements TextToSpeech.OnInitListener {
              private static final int MIC = 10;

              private TextView status;
              private TextView heard;
              private TextView reply;
              private TextView voiceInfo;

              private EditText core;
              private Button conversationButton;

              private SpeechRecognizer sr;
              private TextToSpeech tts;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final String conversationId = UUID.randomUUID().toString();

              private final List<Voice> voiceChoices = new ArrayList<>();
              private int voiceIndex = -1;
              private boolean conversationMode;
              private boolean resumeAfterSpeech = false;
              private boolean destroyed = false;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  conversationMode = AtlasStore.conversationMode(this);
                  buildUi();

                  tts = new TextToSpeech(this, this);

                  try {
                      startForegroundService(
                          new Intent(this, AtlasForegroundService.class)
                      );
                  } catch (Exception ignored) {}

                  if (
                      android.os.Build.VERSION.SDK_INT >= 33
                      && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(
                          new String[] { Manifest.permission.POST_NOTIFICATIONS },
                          11
                      );
                  }

                  if (getIntent().getBooleanExtra("atlas_auto_listen", false)) {
                      handler.postDelayed(this::listen, 900);
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);

                  if (intent.getBooleanExtra("atlas_auto_listen", false)) {
                      handler.postDelayed(this::listen, 350);
                  }
              }

              private TextView tv(String s, int sp) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(sp);
                  v.setPadding(20, 14, 20, 14);
                  return v;
              }

              private Button button(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  return b;
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 28, 28, 28);

                  TextView title = tv("ATLAS v4", 30);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.addView(title);

                  status = tv("STARTING VOICE...", 16);
                  root.addView(status);

                  conversationButton = button("");
                  updateConversationButton();
                  conversationButton.setOnClickListener(v -> {
                      conversationMode = !conversationMode;
                      AtlasStore.setConversationMode(this, conversationMode);
                      updateConversationButton();
                      toast(
                          conversationMode
                              ? "Conversation mode on"
                              : "Conversation mode off"
                      );
                  });
                  root.addView(conversationButton);

                  Button talk = button("TALK TO ATLAS");
                  talk.setOnClickListener(v -> listen());
                  root.addView(talk);

                  Button interrupt = button("INTERRUPT / LISTEN NOW");
                  interrupt.setOnClickListener(v -> {
                      stopSpeech();
                      listen();
                  });
                  root.addView(interrupt);

                  voiceInfo = tv("VOICE: loading...", 14);
                  root.addView(voiceInfo);

                  Button nextVoice = button("NEXT VOICE");
                  nextVoice.setOnClickListener(v -> nextVoice());
                  root.addView(nextVoice);

                  Button testVoice = button("TEST VOICE");
                  testVoice.setOnClickListener(v ->
                      say(
                          "Atlas voice is online. How does this voice sound?",
                          false
                      )
                  );
                  root.addView(testVoice);

                  LinearLayout voiceRow = new LinearLayout(this);
                  voiceRow.setOrientation(LinearLayout.HORIZONTAL);

                  Button slower = button("SLOWER");
                  slower.setOnClickListener(v -> adjustRate(-0.05f));
                  voiceRow.addView(
                      slower,
                      new LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1
                      )
                  );

                  Button normal = button("NORMAL");
                  normal.setOnClickListener(v -> {
                      AtlasStore.setSpeechRate(this, 0.93f);
                      AtlasStore.setPitch(this, 0.97f);
                      applyVoiceTuning();
                      updateVoiceInfo();
                      say("Voice settings reset.", false);
                  });
                  voiceRow.addView(
                      normal,
                      new LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1
                      )
                  );

                  Button faster = button("FASTER");
                  faster.setOnClickListener(v -> adjustRate(0.05f));
                  voiceRow.addView(
                      faster,
                      new LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1
                      )
                  );

                  root.addView(voiceRow);

                  core = new EditText(this);
                  core.setHint("Atlas Core URL (optional)");
                  core.setSingleLine(true);
                  core.setText(AtlasStore.coreUrl(this));
                  root.addView(core);

                  Button save = button("SAVE CORE URL");
                  save.setOnClickListener(v -> {
                      AtlasStore.setCoreUrl(this, core.getText().toString());
                      toast("Core URL saved");
                  });
                  root.addView(save);

                  heard = tv("You: —", 16);
                  root.addView(heard);

                  reply = tv("Atlas: —", 17);
                  reply.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(reply);

                  Button clear = button("CLEAR CONVERSATION");
                  clear.setOnClickListener(v -> {
                      AtlasStore.clearConversation(this);
                      heard.setText("You: —");
                      reply.setText("Atlas: Conversation cleared.");
                      toast("Conversation cleared");
                  });
                  root.addView(clear);

                  TextView hint = tv(
                      "Voice upgrades in v4:\n"
                          + "• auto-listen when invoked as your assistant\n"
                          + "• conversation mode keeps the back-and-forth going\n"
                          + "• cycles through installed high-quality voices\n"
                          + "• remembers recent conversation for Atlas Core\n"
                          + "• say “remember …” for local memory",
                      14
                  );
                  root.addView(hint);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void updateConversationButton() {
                  if (conversationButton != null) {
                      conversationButton.setText(
                          "CONVERSATION MODE: "
                              + (conversationMode ? "ON" : "OFF")
                      );
                  }
              }

              private void adjustRate(float delta) {
                  float r = AtlasStore.speechRate(this) + delta;

                  if (r < 0.65f) r = 0.65f;
                  if (r > 1.25f) r = 1.25f;

                  AtlasStore.setSpeechRate(this, r);
                  applyVoiceTuning();
                  updateVoiceInfo();
                  say("This is the new speaking speed.", false);
              }

              private void applyVoiceTuning() {
                  if (tts == null) return;

                  tts.setSpeechRate(AtlasStore.speechRate(this));
                  tts.setPitch(AtlasStore.pitch(this));
              }

              private void configureVoiceChoices() {
                  if (tts == null) return;

                  voiceChoices.clear();

                  Set<Voice> all = tts.getVoices();

                  if (all != null) {
                      for (Voice v : all) {
                          Locale l = v.getLocale();

                          if (
                              l != null
                              && "en".equalsIgnoreCase(l.getLanguage())
                          ) {
                              voiceChoices.add(v);
                          }
                      }
                  }

                  Collections.sort(
                      voiceChoices,
                      new Comparator<Voice>() {
                          @Override
                          public int compare(Voice a, Voice b) {
                              int q = Integer.compare(
                                  b.getQuality(),
                                  a.getQuality()
                              );

                              if (q != 0) return q;

                              int usA =
                                  "US".equalsIgnoreCase(
                                      a.getLocale().getCountry()
                                  )
                                      ? 1
                                      : 0;

                              int usB =
                                  "US".equalsIgnoreCase(
                                      b.getLocale().getCountry()
                                  )
                                      ? 1
                                      : 0;

                              if (usA != usB) {
                                  return Integer.compare(usB, usA);
                              }

                              int netA =
                                  a.isNetworkConnectionRequired()
                                      ? 1
                                      : 0;

                              int netB =
                                  b.isNetworkConnectionRequired()
                                      ? 1
                                      : 0;

                              return Integer.compare(netB, netA);
                          }
                      }
                  );

                  String saved = AtlasStore.voiceName(this);
                  voiceIndex = -1;

                  for (int i = 0; i < voiceChoices.size(); i++) {
                      if (
                          voiceChoices.get(i)
                              .getName()
                              .equals(saved)
                      ) {
                          voiceIndex = i;
                          break;
                      }
                  }

                  if (
                      voiceIndex < 0
                      && !voiceChoices.isEmpty()
                  ) {
                      voiceIndex = 0;
                  }

                  applySelectedVoice();
              }

              private void applySelectedVoice() {
                  if (
                      tts == null
                      || voiceIndex < 0
                      || voiceIndex >= voiceChoices.size()
                  ) {
                      updateVoiceInfo();
                      return;
                  }

                  Voice v = voiceChoices.get(voiceIndex);
                  int result = tts.setVoice(v);

                  if (result == TextToSpeech.SUCCESS) {
                      AtlasStore.setVoiceName(
                          this,
                          v.getName()
                      );
                  }

                  applyVoiceTuning();
                  updateVoiceInfo();
              }

              private void nextVoice() {
                  if (voiceChoices.isEmpty()) {
                      toast("No alternate English voices found");
                      return;
                  }

                  voiceIndex++;

                  if (voiceIndex >= voiceChoices.size()) {
                      voiceIndex = 0;
                  }

                  applySelectedVoice();

                  say(
                      "This is Atlas voice option "
                          + (voiceIndex + 1)
                          + ".",
                      false
                  );
              }

              private void updateVoiceInfo() {
                  if (voiceInfo == null) return;

                  String name = "system default";
                  String extra = "";

                  if (
                      voiceIndex >= 0
                      && voiceIndex < voiceChoices.size()
                  ) {
                      Voice v = voiceChoices.get(voiceIndex);

                      name = v.getName();

                      extra =
                          " | quality "
                              + v.getQuality()
                              + (
                                  v.isNetworkConnectionRequired()
                                      ? " | network"
                                      : " | local"
                              );
                  }

                  voiceInfo.setText(
                      "VOICE: "
                          + name
                          + extra
                          + " | speed "
                          + String.format(
                              Locale.US,
                              "%.2f",
                              AtlasStore.speechRate(this)
                          )
                  );
              }

              private void listen() {
                  resumeAfterSpeech = false;
                  stopSpeech();

                  if (
                      !SpeechRecognizer.isRecognitionAvailable(this)
                  ) {
                      toast("Speech recognition unavailable");
                      status.setText(
                          "ERROR — speech recognition unavailable"
                      );
                      return;
                  }

                  if (
                      checkSelfPermission(
                          Manifest.permission.RECORD_AUDIO
                      )
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(
                          new String[] {
                              Manifest.permission.RECORD_AUDIO
                          },
                          MIC
                      );

                      return;
                  }

                  if (sr != null) {
                      try {
                          sr.cancel();
                      } catch (Exception ignored) {}

                      try {
                          sr.destroy();
                      } catch (Exception ignored) {}
                  }

                  sr = SpeechRecognizer.createSpeechRecognizer(this);

                  sr.setRecognitionListener(
                      new RecognitionListener() {
                          public void onReadyForSpeech(Bundle p) {
                              status.setText("LISTENING");
                          }

                          public void onBeginningOfSpeech() {}

                          public void onRmsChanged(float r) {}

                          public void onBufferReceived(byte[] b) {}

                          public void onEndOfSpeech() {
                              status.setText("THINKING");
                          }

                          public void onError(int e) {
                              status.setText(
                                  "IDLE — recognition error " + e
                              );
                          }

                          public void onResults(Bundle r) {
                              ArrayList<String> list =
                                  r.getStringArrayList(
                                      SpeechRecognizer
                                          .RESULTS_RECOGNITION
                                  );

                              if (
                                  list != null
                                  && !list.isEmpty()
                              ) {
                                  process(list.get(0));
                              } else {
                                  status.setText("IDLE");
                              }
                          }

                          public void onPartialResults(Bundle p) {}

                          public void onEvent(int t, Bundle p) {}
                      }
                  );

                  Intent i =
                      new Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                      );

                  i.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  i.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE,
                      Locale.getDefault()
                  );

                  i.putExtra(
                      RecognizerIntent.EXTRA_PARTIAL_RESULTS,
                      false
                  );

                  i.putExtra(
                      RecognizerIntent.EXTRA_MAX_RESULTS,
                      3
                  );

                  sr.startListening(i);
              }

              private void process(String text) {
                  heard.setText("You: " + text);

                  AtlasStore.addTurn(
                      this,
                      "user",
                      text
                  );

                  String low =
                      text.toLowerCase(Locale.US).trim();

                  if (low.startsWith("remember ")) {
                      String m =
                          text.substring(9).trim();

                      AtlasStore.remember(this, m);

                      answer(
                          "Got it. I'll remember " + m
                      );

                      return;
                  }

                  if (
                      low.equals("what do you remember")
                      || low.equals("what do you remember?")
                  ) {
                      answer(memorySummary());
                      return;
                  }

                  if (
                      low.equals("read my notifications")
                      || low.equals("what did i miss")
                      || low.equals("what did i miss?")
                  ) {
                      answer(notificationSummary());
                      return;
                  }

                  String base =
                      AtlasStore.coreUrl(this);

                  if (base.isEmpty()) {
                      answer(
                          "I heard you. Voice, conversation mode, local memory, "
                              + "and notification context are working. "
                              + "Add your Atlas Core URL for full intelligence."
                      );

                      return;
                  }

                  status.setText("THINKING");

                  new Thread(
                      () -> callCore(base, text)
                  ).start();
              }

              private String memorySummary() {
                  JSONArray a =
                      AtlasStore.memories(this);

                  if (a.length() == 0) {
                      return "I don't have any saved memories yet.";
                  }

                  StringBuilder s =
                      new StringBuilder(
                          "Here are the latest things I remember. "
                      );

                  int start =
                      Math.max(
                          0,
                          a.length() - 5
                      );

                  for (
                      int i = start;
                      i < a.length();
                      i++
                  ) {
                      if (i > start) {
                          s.append(". ");
                      }

                      s.append(
                          a.optString(i)
                      );
                  }

                  return s.toString();
              }

              private String notificationSummary() {
                  JSONArray a =
                      AtlasStore.notifications(this);

                  if (a.length() == 0) {
                      return "I don't have recent notifications stored yet.";
                  }

                  StringBuilder s =
                      new StringBuilder(
                          "Your latest notifications are. "
                      );

                  int start =
                      Math.max(
                          0,
                          a.length() - 5
                      );

                  for (
                      int i = start;
                      i < a.length();
                      i++
                  ) {
                      if (i > start) {
                          s.append(". ");
                      }

                      s.append(
                          a.optString(i)
                      );
                  }

                  return s.toString();
              }

              private void callCore(
                  String base,
                  String text
              ) {
                  try {
                      String endpoint =
                          base.endsWith("/")
                              ? base + "api/chat"
                              : base + "/api/chat";

                      JSONObject body =
                          new JSONObject();

                      body.put(
                          "text",
                          text
                      );

                      body.put(
                          "device",
                          "Titan 2"
                      );

                      body.put(
                          "source",
                          "voice"
                      );

                      body.put(
                          "conversationId",
                          conversationId
                      );

                      JSONObject ctx =
                          new JSONObject();

                      ctx.put(
                          "recentNotifications",
                          AtlasStore.notifications(this)
                      );

                      ctx.put(
                          "localMemories",
                          AtlasStore.memories(this)
                      );

                      ctx.put(
                          "recentConversation",
                          AtlasStore.conversation(this)
                      );

                      body.put(
                          "context",
                          ctx
                      );

                      byte[] bytes =
                          body.toString()
                              .getBytes(
                                  StandardCharsets.UTF_8
                              );

                      HttpURLConnection c =
                          (HttpURLConnection)
                              new URL(endpoint)
                                  .openConnection();

                      c.setConnectTimeout(12000);
                      c.setReadTimeout(30000);
                      c.setRequestMethod("POST");
                      c.setDoOutput(true);

                      c.setRequestProperty(
                          "Content-Type",
                          "application/json"
                      );

                      try (
                          OutputStream os =
                              c.getOutputStream()
                      ) {
                          os.write(bytes);
                      }

                      int code =
                          c.getResponseCode();

                      BufferedReader br =
                          new BufferedReader(
                              new InputStreamReader(
                                  code >= 200
                                      && code < 300
                                      ? c.getInputStream()
                                      : c.getErrorStream()
                              )
                          );

                      StringBuilder sb =
                          new StringBuilder();

                      String line;

                      while (
                          (line = br.readLine()) != null
                      ) {
                          sb.append(line);
                      }

                      if (
                          code < 200
                          || code >= 300
                      ) {
                          throw new Exception(
                              "Core HTTP "
                                  + code
                                  + " "
                                  + sb
                          );
                      }

                      JSONObject out =
                          new JSONObject(
                              sb.toString()
                          );

                      answer(
                          out.optString(
                              "reply",
                              "Atlas Core returned no reply."
                          )
                      );

                  } catch (Exception e) {
                      answer(
                          "Core error: "
                              + e.getMessage()
                      );
                  }
              }

              private void answer(String s) {
                  AtlasStore.addTurn(
                      this,
                      "assistant",
                      s
                  );

                  runOnUiThread(
                      () -> {
                          reply.setText(
                              "Atlas: " + s
                          );

                          status.setText(
                              "SPEAKING"
                          );

                          say(
                              s,
                              conversationMode
                          );
                      }
                  );
              }

              private void say(
                  String s,
                  boolean continueConversation
              ) {
                  if (tts == null) return;

                  resumeAfterSpeech =
                      continueConversation;

                  Bundle params =
                      new Bundle();

                  tts.speak(
                      s,
                      TextToSpeech.QUEUE_FLUSH,
                      params,
                      "atlas-"
                          + System.currentTimeMillis()
                  );
              }

              private void stopSpeech() {
                  resumeAfterSpeech = false;

                  if (tts != null) {
                      try {
                          tts.stop();
                      } catch (Exception ignored) {}
                  }
              }

              private void toast(String s) {
                  Toast.makeText(
                      this,
                      s,
                      Toast.LENGTH_SHORT
                  ).show();
              }

              @Override
              public void onInit(int x) {
                  if (
                      x != TextToSpeech.SUCCESS
                  ) {
                      status.setText(
                          "VOICE ERROR — TTS unavailable"
                      );

                      return;
                  }

                  tts.setLanguage(Locale.US);

                  tts.setAudioAttributes(
                      new AudioAttributes.Builder()
                          .setUsage(
                              AudioAttributes.USAGE_ASSISTANT
                          )
                          .setContentType(
                              AudioAttributes.CONTENT_TYPE_SPEECH
                          )
                          .build()
                  );

                  tts.setOnUtteranceProgressListener(
                      new UtteranceProgressListener() {
                          @Override
                          public void onStart(String id) {}

                          @Override
                          public void onDone(String id) {
                              boolean shouldResume =
                                  resumeAfterSpeech;

                              resumeAfterSpeech = false;

                              runOnUiThread(
                                  () -> {
                                      if (destroyed) return;

                                      if (
                                          shouldResume
                                          && conversationMode
                                      ) {
                                          status.setText(
                                              "LISTENING NEXT..."
                                          );

                                          handler.postDelayed(
                                              MainActivity.this::listen,
                                              400
                                          );
                                      } else {
                                          status.setText(
                                              "IDLE — voice ready"
                                          );
                                      }
                                  }
                              );
                          }

                          @Override
                          public void onError(String id) {
                              runOnUiThread(
                                  () ->
                                      status.setText(
                                          "IDLE — voice error"
                                      )
                              );
                          }
                      }
                  );

                  configureVoiceChoices();

                  status.setText(
                      "IDLE — v4 voice ready"
                  );
              }

              @Override
              public void onRequestPermissionsResult(
                  int r,
                  String[] p,
                  int[] g
              ) {
                  super.onRequestPermissionsResult(
                      r,
                      p,
                      g
                  );

                  if (
                      r == MIC
                      && g.length > 0
                      && g[0]
                          == PackageManager
                              .PERMISSION_GRANTED
                  ) {
                      listen();
                  }
              }

              @Override
              protected void onDestroy() {
                  destroyed = true;

                  handler.removeCallbacksAndMessages(
                      null
                  );

                  if (sr != null) {
                      try {
                          sr.cancel();
                      } catch (Exception ignored) {}

                      try {
                          sr.destroy();
                      } catch (Exception ignored) {}
                  }

                  if (tts != null) {
                      try {
                          tts.stop();
                      } catch (Exception ignored) {}

                      try {
                          tts.shutdown();
                      } catch (Exception ignored) {}
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare Atlas-v4.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Atlas-v4.apk
          sha256sum dist/Atlas-v4.apk > dist/Atlas-v4.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-v4-apk
          path: |
            dist/Atlas-v4.apk
            dist/Atlas-v4.sha256
          if-no-files-found: error
