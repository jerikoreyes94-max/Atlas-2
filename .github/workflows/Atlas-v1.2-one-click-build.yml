          package com.atlas.personalai;
 
          import android.content.Context;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
 
          public final class VoiceAgentBridge {
              private static final ExecutorService EXEC=Executors.newCachedThreadPool();
              private static final String PREF="atlas_voice_bridge_v13";
              private VoiceAgentBridge(){}
 
              public static String delegate(Context c, JSONObject a){
                  String target=a.optString("target","").trim(); String objective=a.optString("objective","").trim();
                  if(target.isEmpty()||objective.isEmpty()) return "A delegated call needs a contact and an objective.";
                  ContactTools.ContactHit hit=ContactTools.find(c,target); String number=hit==null?target:hit.number; String name=hit==null?target:hit.name;
                  return delegateResolved(c,number,name,objective,a.optString("id","manual"));
              }
 
              public static String delegateResolved(Context c,String number,String name,String objective,String reference){
                  if(!SecureStore.has(c,"relay_url")) return "Atlas Voice Relay is not configured yet.";
                  if(number==null||number.trim().isEmpty()||objective==null||objective.trim().isEmpty()) return "The delegated call is missing a number or objective.";
                  Context app=c.getApplicationContext(); EXEC.execute(() -> start(app,number,name,objective,reference));
                  return "Starting an Atlas delegated AI call with "+(name==null?"that contact":name)+".";
              }
 
              private static void start(Context c,String number,String name,String objective,String reference){
                  try{
                      String base=SecureStore.get(c,"relay_url"); String endpoint=(base.endsWith("/")?base.substring(0,base.length()-1):base)+"/v1/calls";
                      JSONObject body=new JSONObject().put("to",number).put("displayName",name==null?"":name).put("objective",objective).put("reference",reference)
                              .put("memory",tail(AtlasStore.memories(c),12));
                      JSONObject out=request("POST",endpoint,SecureStore.get(c,"relay_token"),body.toString());
                      String id=out.optString("id",out.optString("callSid",""));
                      c.getSharedPreferences(PREF,Context.MODE_PRIVATE).edit().putString("last_id",id).putString("last_status","Call started: "+name+" - "+objective).apply();
                      if(!id.isEmpty()) EXEC.execute(() -> poll(c,base,id));
                  }catch(Exception e){ c.getSharedPreferences(PREF,Context.MODE_PRIVATE).edit().putString("last_status","Delegated call failed: "+e.getMessage()).apply(); }
              }
 
              private static void poll(Context c,String base,String id){
                  String root=base.endsWith("/")?base.substring(0,base.length()-1):base;
                  for(int i=0;i<30;i++){
                      try{ Thread.sleep(10000L); JSONObject o=request("GET",root+"/v1/calls/"+java.net.URLEncoder.encode(id,"UTF-8"),SecureStore.get(c,"relay_token"),null); String status=o.optString("status",""); String summary=o.optString("summary",""); c.getSharedPreferences(PREF,Context.MODE_PRIVATE).edit().putString("last_status",status+(summary.isEmpty()?"":" - "+summary)).apply(); if("completed".equalsIgnoreCase(status)||"failed".equalsIgnoreCase(status)) break; }catch(Exception ignored){}
                  }
              }
 
              public static String lastStatus(Context c){ return c.getSharedPreferences(PREF,Context.MODE_PRIVATE).getString("last_status","No delegated AI call has been run yet."); }
              private static JSONArray tail(JSONArray a,int max){ JSONArray out=new JSONArray(); if(a==null)return out; for(int i=Math.max(0,a.length()-max);i<a.length();i++)out.put(a.opt(i)); return out; }
 
              private static JSONObject request(String method,String endpoint,String token,String body)throws Exception{
                  HttpURLConnection h=(HttpURLConnection)new URL(endpoint).openConnection(); h.setConnectTimeout(15000); h.setReadTimeout(30000); h.setRequestMethod(method); h.setRequestProperty("Accept","application/json"); if(token!=null&&!token.isEmpty())h.setRequestProperty("Authorization","Bearer "+token);
                  if(body!=null){ h.setDoOutput(true); h.setRequestProperty("Content-Type","application/json; charset=utf-8"); try(OutputStream os=h.getOutputStream()){os.write(body.getBytes(StandardCharsets.UTF_8));} }
                  int code=h.getResponseCode(); InputStream in=code>=200&&code<300?h.getInputStream():h.getErrorStream(); String raw=read(in); h.disconnect(); if(code<200||code>=300)throw new Exception("HTTP "+code+" "+raw); return raw.trim().isEmpty()?new JSONObject():new JSONObject(raw);
              }
              private static String read(InputStream in)throws Exception{ if(in==null)return""; BufferedReader br=new BufferedReader(new InputStreamReader(in,StandardCharsets.UTF_8)); StringBuilder s=new StringBuilder(); String line; while((line=br.readLine())!=null)s.append(line); return s.toString(); }
          }
