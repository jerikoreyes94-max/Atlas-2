                  JSONArray a = array(c, "tasks"); boolean found = false;
                  for (int i=0;i<a.length();i++) { JSONObject t=a.optJSONObject(i); if (t!=null && id.equals(t.optString("id"))) { try { t.put("active", false); } catch(Exception ignored){} found=true; } }
                  put(c, "tasks", a);
                  Intent i = new Intent(c, AtlasTaskReceiver.class).putExtra("task_id", id);
                  PendingIntent pi = PendingIntent.getBroadcast(c, id.hashCode(), i, PendingIntent.FLAG_NO_CREATE | PendingIntent.FLAG_IMMUTABLE);
                  AlarmManager am = (AlarmManager)c.getSystemService(Context.ALARM_SERVICE); if (am != null && pi != null) am.cancel(pi);
                  return found ? "Automation cancelled." : "I couldn't find that automation.";
              }
 
              public static String summary(Context c) {
                  JSONArray a = array(c, "tasks"); StringBuilder s = new StringBuilder(); int shown=0;
                  for (int i=0;i<a.length();i++) { JSONObject t=a.optJSONObject(i); if (t==null || !t.optBoolean("active",false)) continue; if (shown++>0) s.append(" | "); s.append(t.optString("id").substring(0, Math.min(8,t.optString("id").length()))).append(": ").append(t.optString("type")).append(" -> ").append(t.optString("target")).append(" @ ").append(new java.util.Date(t.optLong("whenMillis"))); if(shown>=12) break; }
                  return shown==0 ? "No active automations." : s.toString();
              }
 
              public static String setContactRule(Context c, JSONObject a) {
                  try {
                      String target = a.optString("target", "").trim(); if (target.isEmpty()) return "That contact rule needs a contact.";
                      ContactTools.ContactHit hit = ContactTools.find(c, target); String number = hit == null ? target : hit.number; String name = hit == null ? target : hit.name;
                      JSONObject rule = new JSONObject().put("id", UUID.randomUUID().toString()).put("target", name).put("number", digits(number))
                              .put("incomingPolicy", normalizeIncoming(a.optString("incomingPolicy", "ask"))).put("missedCallMessage", a.optString("missedCallMessage", ""));
                      JSONArray src=array(c,"contact_rules"), out=new JSONArray(); String key=digits(number);
                      for(int i=0;i<src.length();i++){ JSONObject old=src.optJSONObject(i); if(old!=null && !key.equals(old.optString("number"))) out.put(old); }
                      out.put(rule); put(c,"contact_rules",out); return "Saved the contact rule for " + name + ".";
                  } catch(Exception e){ return "Rule error: " + e.getMessage(); }
              }
 
              public static JSONObject contactRule(Context c, String number) {
                  String key=digits(number); JSONArray a=array(c,"contact_rules");
                  for(int i=a.length()-1;i>=0;i--){ JSONObject r=a.optJSONObject(i); if(r!=null && key.equals(r.optString("number"))) return r; }
                  return null;
              }
 
              public static String setEventRule(Context c, JSONObject a) {
                  try {
                      String event=a.optString("event","").trim(); String contains=a.optString("contains","").trim(); String action=a.optString("action","send_sms").trim();
                      if(!"notification_contains".equals(event) || contains.isEmpty()) return "1.3 event rules currently require event notification_contains and a contains phrase.";
                      if(!"send_sms".equals(action) && !"delegate_call".equals(action)) return "That background rule action is unsupported.";
                      JSONObject r=new JSONObject().put("id",UUID.randomUUID().toString()).put("event",event).put("contains",contains).put("action",action)
                              .put("target",a.optString("target","")).put("message",a.optString("message","")).put("objective",a.optString("objective","")).put("enabled",true);
                      JSONArray rules=array(c,"event_rules"); rules.put(r); trim(rules,100); put(c,"event_rules",rules); return "Background automation rule saved.";
                  } catch(Exception e){ return "Rule error: " + e.getMessage(); }
              }
 
              public static void onNotification(Context c, String pkg, String title, String text) {
                  String hay=((pkg==null?"":pkg)+" "+(title==null?"":title)+" "+(text==null?"":text)).toLowerCase(Locale.US);
                  if(hay.contains("missed call")) {
                      JSONArray contactRules=array(c,"contact_rules");
                      for(int i=0;i<contactRules.length();i++) {
                          JSONObject cr=contactRules.optJSONObject(i); if(cr==null) continue;
                          String contactName=cr.optString("target","").toLowerCase(Locale.US);
                          String auto=cr.optString("missedCallMessage","").trim();
                          if(!auto.isEmpty() && !contactName.isEmpty() && hay.contains(contactName)) {
                              String throttle="missed_"+cr.optString("id",""); long last=p(c).getLong(throttle,0L);
                              if(System.currentTimeMillis()-last>300000L) { p(c).edit().putLong(throttle,System.currentTimeMillis()).apply(); SmsTools.send(c,cr.optString("number",""),auto); }
                          }
                      }
                  }
                  JSONArray rules=array(c,"event_rules");
                  for(int i=0;i<rules.length();i++){
                      JSONObject r=rules.optJSONObject(i); if(r==null||!r.optBoolean("enabled",true)) continue;
                      String needle=r.optString("contains","").toLowerCase(Locale.US); if(needle.isEmpty()||!hay.contains(needle)) continue;
                      long last=p(c).getLong("rule_last_"+r.optString("id"),0L); if(System.currentTimeMillis()-last<300000L) continue;
                      p(c).edit().putLong("rule_last_"+r.optString("id"),System.currentTimeMillis()).apply();
                      String target=r.optString("target",""); ContactTools.ContactHit hit=ContactTools.find(c,target); String number=hit==null?target:hit.number;
                      if("send_sms".equals(r.optString("action"))) SmsTools.send(c,number,r.optString("message",""));
                      else VoiceAgentBridge.delegateResolved(c,number,hit==null?target:hit.name,r.optString("objective",""),r.optString("id",""));
                  }
              }
 
              public static void executeTask(Context c, String id) {
                  JSONArray a=array(c,"tasks"); JSONObject task=null;
                  for(int i=0;i<a.length();i++){ JSONObject t=a.optJSONObject(i); if(t!=null&&id.equals(t.optString("id"))&&t.optBoolean("active",false)){task=t;break;} }
                  if(task==null) return;
                  String result;
                  String type=task.optString("type","");
                  if("sms".equals(type)) result=SmsTools.send(c,task.optString("number",""),task.optString("message",""));
                  else if("ai_call".equals(type)) result=VoiceAgentBridge.delegateResolved(c,task.optString("number",""),task.optString("target",""),task.optString("objective",""),task.optString("id",""));
                  else { showCarrierCall(c,task); result="Scheduled carrier call is ready."; }
                  AtlasStore.addNotification(c,System.currentTimeMillis()+" | Atlas automation | "+task.optString("type")+" | "+result);
                  String repeat=task.optString("repeat","none"); long next=nextTime(task.optLong("whenMillis"),repeat);
                  try { if(next>0){ task.put("whenMillis",next); schedule(c,task); } else task.put("active",false); } catch(Exception ignored){}
                  put(c,"tasks",a);
              }
 
              private static void showCarrierCall(Context c, JSONObject task) {
                  NotificationManager nm=(NotificationManager)c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if(Build.VERSION.SDK_INT>=26) nm.createNotificationChannel(new NotificationChannel(CH,"Atlas Automations",NotificationManager.IMPORTANCE_HIGH));
                  Intent dial=new Intent(Intent.ACTION_DIAL, Uri.parse("tel:"+Uri.encode(task.optString("number","")))); dial.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  PendingIntent pi=PendingIntent.getActivity(c,task.optString("id","").hashCode(),dial,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
                  android.app.Notification n=new android.app.Notification.Builder(c,CH).setSmallIcon(R.drawable.atlas_small_icon).setContentTitle("Atlas scheduled call").setContentText("Call "+task.optString("target","contact")).setContentIntent(pi).setAutoCancel(true).build();
                  nm.notify(task.optString("id","").hashCode(),n);
              }
 
              private static long nextTime(long previous,String repeat){ long day=86400000L; if("daily".equals(repeat)) return previous+day; if("weekdays".equals(repeat)){ long n=previous+day; java.util.Calendar cal=java.util.Calendar.getInstance(); cal.setTimeInMillis(n); while(cal.get(java.util.Calendar.DAY_OF_WEEK)==java.util.Calendar.SATURDAY||cal.get(java.util.Calendar.DAY_OF_WEEK)==java.util.Calendar.SUNDAY){ n+=day; cal.setTimeInMillis(n);} return n;} if("weekly".equals(repeat)) return previous+7L*day; return 0L; }
              private static String normalizeRepeat(String s){ s=s==null?"none":s.toLowerCase(Locale.US); return ("daily".equals(s)||"weekdays".equals(s)||"weekly".equals(s))?s:"none"; }
              private static String normalizeIncoming(String s){ s=s==null?"ask":s.toLowerCase(Locale.US); return ("allow".equals(s)||"silence".equals(s)||"reject".equals(s))?s:"ask"; }
              private static String digits(String s){ if(s==null)return""; String d=s.replaceAll("\\D",""); return d.length()>10?d.substring(d.length()-10):d; }
              private static void trim(JSONArray a,int max){ while(a.length()>max)a.remove(0); }
          }
