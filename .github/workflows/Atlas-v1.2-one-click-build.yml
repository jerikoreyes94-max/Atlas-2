                      "end_call", "ui_back", "ui_home", "ui_recents", "ui_notifications",
                      "ui_quick_settings", "ui_scroll_down", "ui_scroll_up", "ui_swipe_up",
                      "ui_swipe_down", "ui_swipe_left", "ui_swipe_right", "ui_click_text",
                      "ui_type_text", "ui_screenshot", "ui_lock_screen", "schedule_sms", "schedule_call",
                      "delegate_call", "list_automations", "cancel_automation", "set_contact_rule",
                      "set_event_rule", "get_delegated_call_status"
              ));
 
              private AtlasCore() {}
 
              public static boolean isConfigured(Context c) {
                  return SecureStore.has(c, "gemini_key") || SecureStore.has(c, "openrouter_key") || SecureStore.has(c, "groq_key");
              }
 
              public static String shortStatus(Context c) {
                  if (SecureStore.has(c, "gemini_key")) return "GEMINI 3.8 AGENT";
                  if (SecureStore.has(c, "openrouter_key")) return "OPENROUTER AGENT";
                  if (SecureStore.has(c, "groq_key")) return "GROQ COMPOUND";
                  if (!AtlasStore.coreUrl(c).isEmpty()) return "CUSTOM CORE";
                  return "NO BRAIN";
              }
 
              public static String status(Context c) {
                  List<String> ready = new ArrayList<>();
                  if (SecureStore.has(c, "gemini_key")) ready.add("Gemini 3.8 Flash primary agent");
                  if (SecureStore.has(c, "groq_key")) ready.add("Groq Compound live-web specialist");
                  if (SecureStore.has(c, "openrouter_key")) ready.add("OpenRouter free fallback");
                  if (!AtlasStore.coreUrl(c).isEmpty()) ready.add("custom core fallback");
                  if (SecureStore.has(c, "relay_url")) ready.add("delegated voice-call relay");
                  if (ready.isEmpty()) return "Atlas 1.3 agent code is installed. Add at least one AI key.";
                  SharedPreferences hp = c.getSharedPreferences(HEALTH_PREF, Context.MODE_PRIVATE);
                  String last = hp.getString("last_provider", "");
                  return "Life agent ready: " + String.join(" | ", ready) + (last.isEmpty() ? "" : ". Last brain: " + last);
