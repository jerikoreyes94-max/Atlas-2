            const u=new URL(req.url,'http://localhost'); const id=u.searchParams.get('id'); const call=calls.get(id); if(!call){ws.close();return;} call.status='connected';
            ws.on('message',async buf=>{
              try{const msg=JSON.parse(buf.toString()); if(msg.type==='prompt'&&msg.last){call.history.push({role:'contact',text:msg.voicePrompt}); const out=await brain(call,msg.voicePrompt||''); call.history.push({role:'atlas',text:out.say}); call.summary=out.summary||call.summary; ws.send(JSON.stringify({type:'text',token:out.say||'Thanks.',last:true,interruptible:true,preemptible:true})); if(out.done){setTimeout(()=>{try{ws.send(JSON.stringify({type:'end',handoffData:JSON.stringify({summary:call.summary})}));}catch{}},Math.min(8000,Math.max(1800,(out.say||'').length*45)));}} else if(msg.type==='error'){call.status='failed';call.summary=msg.description||'Conversation Relay error';}}
              catch(e){call.summary='Voice agent error: '+String(e.message||e); try{ws.send(JSON.stringify({type:'text',token:'I am sorry, I hit a technical problem. I will let them know.',last:true}));}catch{}}
            });
            ws.on('close',()=>{if(call.status!=='failed'&&call.status!=='completed')call.status='completed';});
          });
 
          server.listen(PORT,()=>console.log(`Atlas Voice Relay listening on ${PORT}`));
          NODE
 
          cat > atlas-relay/.env.example <<'ENV'
          PORT=8080
          PUBLIC_BASE_URL=https://your-public-relay.example.com
          RELAY_TOKEN=change-me
          TWILIO_ACCOUNT_SID=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          TWILIO_AUTH_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          TWILIO_FROM_NUMBER=+15555550123
          GEMINI_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          ENV
 
          echo "Atlas 1.3 life-agent, automation engine, call assistant, and voice relay source installed."
 
      - name: Build Atlas 1.3
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
 
      - name: Prepare and verify Atlas 1.3 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" "dist/Atlas-1.3-LIFE-AGENT.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "dist/Atlas-1.3-LIFE-AGENT.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "dist/Atlas-1.3-LIFE-AGENT.apk" | head -n 5
          sha256sum "dist/Atlas-1.3-LIFE-AGENT.apk" > "dist/Atlas-1.3-LIFE-AGENT.sha256"
 
      - name: Upload Atlas 1.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-1.3-LIFE-AGENT
          path: |
            dist/Atlas-1.3-LIFE-AGENT.apk
            dist/Atlas-1.3-LIFE-AGENT.sha256
            atlas-relay/
          if-no-files-found: error
          retention-days: 30
