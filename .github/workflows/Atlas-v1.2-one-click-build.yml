name: Build Atlas 1.3 Life Agent
 
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/Atlas-v1.3-life-agent.yml'
 
permissions:
  contents: read
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
 
      - name: Restore permanent Atlas signer
        uses: actions/cache/restore@v4
        with:
          path: .atlas-signing/atlas.jks
          key: atlas-personalai-signing-v5-stable
          fail-on-cache-miss: true
 
      - name: Android SDK
        uses: android-actions/setup-android@v3
 
      - name: Install Android 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
 
      - name: Install Atlas 1.3 integrated core
        shell: bash
        run: |
          set -euo pipefail
 
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/atlas/personalai/MainActivity.java
          test -f app/src/main/java/com/atlas/personalai/ActionEngine.java
          test -f app/src/main/java/com/atlas/personalai/AtlasStore.java
          test -f app/src/main/java/com/atlas/personalai/CapabilityManager.java
          test -f app/src/main/java/com/atlas/personalai/DeviceContext.java
          test -f .atlas-signing/atlas.jks
 
          python3 <<'PYCODE'
          from pathlib import Path
          import re
 
          build = Path('app/build.gradle')
          s = build.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode 1300', s, count=1)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '1.3.0'", s, count=1)
          build.write_text(s)
 
          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android:name=".CoreSettingsActivity"' not in m:
              anchor = '        <activity\n            android:name=".MainActivity"'
              if anchor not in m:
                  raise SystemExit('MainActivity manifest anchor missing')
              m = m.replace(anchor, '        <activity android:name=".CoreSettingsActivity" android:exported="false" />\n\n' + anchor, 1)
          manifest.write_text(m)
 
          main = Path('app/src/main/java/com/atlas/personalai/MainActivity.java')
          t = main.read_text()
          t = t.replace('ATLAS 1.1', 'ATLAS 1.3 LIFE AGENT')
          t = t.replace('ATLAS v7 FULL', 'ATLAS 1.3 LIFE AGENT')
          t = t.replace('FREE AI CORE SETUP', 'CORE SETTINGS / PROVIDERS')
          t = t.replace('Atlas 1.1 is ready for a free AI core.', 'Atlas 1.3 integrated core is ready. Configure at least one AI provider in Core Settings.')
          t = t.replace('Opening free AI core setup.', 'Opening Atlas 1.3 core settings.')
 
          banner_anchor = '        status = tv("STARTING...", 16); root.addView(status);\n        accessInfo = tv("ACCESS: checking...", 13); root.addView(accessInfo);'
          if 'CORE / BRAIN STATUS' not in t and banner_anchor in t:
              banner = '''        status = tv("STARTING...", 16); root.addView(status);
                  TextView brainState = tv("CORE / BRAIN STATUS: " + AtlasCore.status(this), 15);
                  brainState.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(brainState);
                  Button brain = button("OPEN CORE / BRAIN");
                  brain.setOnClickListener(v -> startActivity(new Intent(this, CoreSettingsActivity.class)));
                  root.addView(brain);
                  accessInfo = tv("ACCESS: checking...", 13); root.addView(accessInfo);'''
              t = t.replace(banner_anchor, banner, 1)
 
          if 'low.equals("core status")' not in t:
              anchor = '        if (low.equals("what did i miss") || low.equals("what did i miss?")) { speakReply(notificationSummary(), conversationMode); return; }'
              if anchor in t:
                  addition = anchor + '\n        if (low.equals("core status") || low.equals("core status?")) { speakReply(AtlasCore.status(this), conversationMode); return; }\n        if (low.equals("setup core") || low.equals("core setup") || low.equals("open core")) { startActivity(new Intent(this, CoreSettingsActivity.class)); speakReply("Opening Atlas 1.3 core settings.", false); return; }'
                  t = t.replace(anchor, addition, 1)
 
          old_route = '''        String base = AtlasStore.coreUrl(this);
                  if (base.isEmpty()) {
            speakReply("My phone-agent layer is active. I can control apps and the interface, use contacts, calls, texts, media, calendar, location, notifications, camera, flashlight, clipboard, and local memory. Add Atlas Core for general intelligence and multi-step reasoning.", conversationMode);
            return;
                  }
                  status.setText("THINKING");
                  new Thread(() -> callCore(base, text)).start();
          '''
          new_route = '''        if (!AtlasCore.isConfigured(this) && AtlasStore.coreUrl(this).isEmpty()) {
            speakReply("Atlas 1.3 phone controls are online, but the AI core needs a provider. Open Core Settings and add an OpenRouter, Groq, or Gemini key.", conversationMode);
            return;
                  }
                  status.setText("THINKING - " + AtlasCore.shortStatus(this));
                  new Thread(() -> callCore("", text)).start();
          '''
          if old_route in t:
              t = t.replace(old_route, new_route, 1)
 
          start = t.find('    private void callCore(')
          end = t.find('    private String memorySummary()', start)
          if start >= 0 and end > start:
              replacement = '''    private void callCore(String ignored, String text) {
                  try {
            JSONObject out = AtlasCore.ask(this, text, conversationId);
            String r = out.optString("reply", "");
            JSONArray memories = out.optJSONArray("memories");
            if (memories != null) {
                for (int i = 0; i < memories.length(); i++) {
                    String memory = memories.optString(i, "").trim();
                    if (!memory.isEmpty()) AtlasStore.remember(this, memory);
                }
            }
            JSONArray actions = out.optJSONArray("actions");
            JSONObject single = out.optJSONObject("action");
            String provider = out.optString("provider", "core");
            final String shown = r.isEmpty() ? "Atlas core returned no reply." : r;
            runOnUiThread(() -> {
                status.setText("CORE: " + provider.toUpperCase(Locale.US));
                if (actions != null && actions.length() > 0) {
                    queuedActions = actions;
                    runQueuedActions(shown);
                } else if (single != null) {
                    routeAction(single, shown);
                } else {
                    speakReply(shown, conversationMode);
                }
            });
                  } catch (Exception e) {
            runOnUiThread(() -> {
                status.setText("CORE ERROR");
                speakReply("Core error: " + e.getMessage(), conversationMode);
            });
                  }
              }
 
          '''
              t = t[:start] + replacement + t[end:]
          else:
              raise SystemExit('callCore method markers missing')
 
          main.write_text(t)
          PYCODE
 
          cat > app/src/main/java/com/atlas/personalai/SecureStore.java <<'JAVA'
          package com.atlas.personalai;
 
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.util.Base64;
          import java.nio.charset.StandardCharsets;
          import java.security.KeyStore;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;
 
          public final class SecureStore {
              private static final String ALIAS = "atlas_core_v13";
              private static final String PREF = "atlas_secure_core_v13";
 
              private SecureStore() {}
 
              private static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }
 
              private static SecretKey key() throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (!ks.containsAlias(ALIAS)) {
                      KeyGenerator kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                      kg.init(new KeyGenParameterSpec.Builder(
                              ALIAS,
                              KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                              .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                              .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                              .setRandomizedEncryptionRequired(true)
                              .build());
                      kg.generateKey();
                  }
                  return ((KeyStore.SecretKeyEntry) ks.getEntry(ALIAS, null)).getSecretKey();
              }
 
              public static void set(Context c, String name, String value) {
                  try {
                      if (value == null || value.trim().isEmpty()) return;
                      Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                      cipher.init(Cipher.ENCRYPT_MODE, key());
                      byte[] encrypted = cipher.doFinal(value.trim().getBytes(StandardCharsets.UTF_8));
                      String packed = Base64.encodeToString(cipher.getIV(), Base64.NO_WRAP) + ":" +
                              Base64.encodeToString(encrypted, Base64.NO_WRAP);
                      prefs(c).edit().putString(name, packed).apply();
                  } catch (Exception e) {
                      throw new RuntimeException("Secure core storage failed", e);
                  }
              }
 
              public static String get(Context c, String name) {
                  try {
                      String packed = prefs(c).getString(name, "");
                      if (packed == null || packed.isEmpty()) return "";
                      String[] parts = packed.split(":", 2);
                      if (parts.length != 2) return "";
                      byte[] iv = Base64.decode(parts[0], Base64.NO_WRAP);
                      byte[] encrypted = Base64.decode(parts[1], Base64.NO_WRAP);
                      Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                      cipher.init(Cipher.DECRYPT_MODE, key(), new GCMParameterSpec(128, iv));
                      return new String(cipher.doFinal(encrypted), StandardCharsets.UTF_8);
                  } catch (Exception e) {
                      return "";
                  }
              }
 
              public static boolean has(Context c, String name) {
                  return !get(c, name).isEmpty();
              }
 
              public static void remove(Context c, String name) {
                  prefs(c).edit().remove(name).apply();
              }
 
              public static void clearCoreKeys(Context c) {
                  prefs(c).edit().clear().apply();
              }
          }
          JAVA
 
          cat > app/src/main/java/com/atlas/personalai/AtlasCore.java <<'JAVA'
          package com.atlas.personalai;
 
          import android.content.Context;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
 
          public final class AtlasCore {
              private static final String HEALTH_PREF = "atlas_core_health_v13";
              private static final int MAX_ACTIONS = 8;
              private static final Set<String> ALLOWED_ACTIONS = new HashSet<>(Arrays.asList(
                      "open_app", "navigate", "web_search", "get_location", "call_contact", "dial_number",
                      "send_sms", "read_sms", "create_calendar_event", "media_play", "media_pause",
                      "media_next", "media_previous", "volume_up", "volume_down", "flashlight_on",
                      "flashlight_off", "open_camera", "clipboard_copy", "clipboard_read", "answer_call",
                      "end_call", "ui_back", "ui_home", "ui_recents", "ui_notifications",
                      "ui_quick_settings", "ui_scroll_down", "ui_scroll_up", "ui_swipe_up",
                      "ui_swipe_down", "ui_swipe_left", "ui_swipe_right", "ui_click_text",
                      "ui_type_text", "ui_screenshot", "ui_lock_screen"
              ));
 
              private AtlasCore() {}
 
              public static boolean isConfigured(Context c) {
                  return SecureStore.has(c, "openrouter_key") ||
                          SecureStore.has(c, "groq_key") ||
                          SecureStore.has(c, "gemini_key");
              }
 
              public static String shortStatus(Context c) {
                  if (SecureStore.has(c, "groq_key")) return "GROQ WEB + CORE";
                  if (SecureStore.has(c, "openrouter_key")) return "OPENROUTER FREE";
                  if (SecureStore.has(c, "gemini_key")) return "GEMINI 2.5";
                  if (!AtlasStore.coreUrl(c).isEmpty()) return "CUSTOM CORE";
                  return "NO PROVIDER";
              }
 
              public static String status(Context c) {
                  List<String> ready = new ArrayList<>();
                  if (SecureStore.has(c, "openrouter_key")) ready.add("OpenRouter free");
                  if (SecureStore.has(c, "groq_key")) ready.add("Groq Compound web");
                  if (SecureStore.has(c, "gemini_key")) ready.add("Gemini 2.5 Flash-Lite");
                  if (!AtlasStore.coreUrl(c).isEmpty()) ready.add("custom fallback");
 
                  SharedPreferences hp = c.getSharedPreferences(HEALTH_PREF, Context.MODE_PRIVATE);
                  String last = hp.getString("last_provider", "");
                  long lastOk = hp.getLong("last_success", 0L);
 
                  if (ready.isEmpty()) {
                      return "Integrated core installed, but no AI provider is configured yet.";
                  }
                  String result = "Integrated core ready: " + String.join(" | ", ready);
                  if (!last.isEmpty() && lastOk > 0L) result += ". Last success: " + last;
                  return result;
              }
 
              public static JSONObject ask(Context c, String text, String conversationId) throws Exception {
                  String request = text == null ? "" : text.trim();
                  if (request.isEmpty()) return empty("What do you want me to do?");
 
                  List<String> errors = new ArrayList<>();
                  boolean fresh = needsFreshWeb(request);
 
                  if (fresh && SecureStore.has(c, "groq_key")) {
                      try { return finish(c, normalize(callGroq(c, request, conversationId), "groq-compound")); }
                      catch (Exception e) { errors.add("Groq: " + shortError(e)); recordFailure(c, "groq-compound", e); }
                  }
 
                  if (SecureStore.has(c, "openrouter_key")) {
                      try { return finish(c, normalize(callOpenRouter(c, request, conversationId), "openrouter-free")); }
                      catch (Exception e) { errors.add("OpenRouter: " + shortError(e)); recordFailure(c, "openrouter-free", e); }
                  }
 
                  if (!fresh && SecureStore.has(c, "groq_key")) {
                      try { return finish(c, normalize(callGroq(c, request, conversationId), "groq-compound")); }
                      catch (Exception e) { errors.add("Groq: " + shortError(e)); recordFailure(c, "groq-compound", e); }
                  }
 
                  if (SecureStore.has(c, "gemini_key")) {
                      try { return finish(c, normalize(callGemini(c, request, conversationId), "gemini-2.5-flash-lite")); }
                      catch (Exception e) { errors.add("Gemini: " + shortError(e)); recordFailure(c, "gemini-2.5-flash-lite", e); }
                  }
 
                  if (!AtlasStore.coreUrl(c).isEmpty()) {
                      try { return finish(c, callCustomCore(c, request, conversationId)); }
                      catch (Exception e) { errors.add("Custom: " + shortError(e)); recordFailure(c, "custom-core", e); }
                  }
 
                  if (errors.isEmpty()) {
                      throw new Exception("No AI provider configured. Open Core Settings and add one key.");
                  }
                  throw new Exception("All configured core providers failed. " + String.join(" | ", errors));
              }
 
              private static JSONObject finish(Context c, JSONObject out) throws Exception {
                  sanitizeActions(out);
                  String provider = out.optString("provider", "core");
                  recordSuccess(c, provider);
                  return out;
              }
 
              private static JSONObject empty(String reply) throws Exception {
                  return new JSONObject()
                          .put("reply", reply)
                          .put("actions", new JSONArray())
                          .put("memories", new JSONArray())
                          .put("provider", "local-core");
              }
 
              private static boolean needsFreshWeb(String text) {
                  String s = text.toLowerCase(Locale.US);
                  String[] hints = {
                          "today", "latest", "current", "news", "weather", "score", "scores", "price",
                          "open now", "right now", "this week", "this month", "search the web", "look online",
                          "find online", "what happened", "who is the current", "traffic", "stock", "market"
                  };
                  for (String h : hints) if (s.contains(h)) return true;
                  return false;
              }
 
              private static String callOpenRouter(Context c, String text, String conversationId) throws Exception {
                  JSONObject body = openAiBody(c, text, conversationId, "openrouter/free");
                  body.put("response_format", new JSONObject().put("type", "json_object"));
                  HttpURLConnection h = connection("https://openrouter.ai/api/v1/chat/completions");
                  h.setRequestProperty("Authorization", "Bearer " + SecureStore.get(c, "openrouter_key"));
                  h.setRequestProperty("HTTP-Referer", "https://github.com/jerikoreyes94-max/Atlas-2");
                  h.setRequestProperty("X-Title", "Atlas Personal AI 1.2");
                  String raw = post(h, body.toString());
                  JSONObject o = new JSONObject(raw);
                  return o.getJSONArray("choices").getJSONObject(0)
                          .getJSONObject("message").optString("content", "");
              }
 
              private static String callGroq(Context c, String text, String conversationId) throws Exception {
                  JSONObject body = openAiBody(c, text, conversationId, "groq/compound");
                  HttpURLConnection h = connection("https://api.groq.com/openai/v1/chat/completions");
                  h.setRequestProperty("Authorization", "Bearer " + SecureStore.get(c, "groq_key"));
                  String raw = post(h, body.toString());
                  JSONObject o = new JSONObject(raw);
                  return o.getJSONArray("choices").getJSONObject(0)
                          .getJSONObject("message").optString("content", "");
              }
 
              private static String callGemini(Context c, String text, String conversationId) throws Exception {
                  String endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent";
                  JSONObject body = new JSONObject();
                  JSONArray contents = new JSONArray();
                  JSONObject content = new JSONObject();
                  JSONArray parts = new JSONArray();
                  parts.put(new JSONObject().put("text",
                          systemPrompt() + "\n\nPHONE_CONTEXT:\n" + context(c, conversationId, text).toString() +
                                  "\n\nUSER REQUEST:\n" + text));
                  content.put("parts", parts);
                  contents.put(content);
                  body.put("contents", contents);
                  JSONObject config = new JSONObject();
                  config.put("temperature", 0.2);
                  config.put("maxOutputTokens", 1800);
                  config.put("responseMimeType", "application/json");
                  body.put("generationConfig", config);
 
                  HttpURLConnection h = connection(endpoint);
                  h.setRequestProperty("x-goog-api-key", SecureStore.get(c, "gemini_key"));
                  String raw = post(h, body.toString());
                  JSONObject o = new JSONObject(raw);
                  return o.getJSONArray("candidates").getJSONObject(0)
                          .getJSONObject("content").getJSONArray("parts").getJSONObject(0)
                          .optString("text", "");
              }
 
              private static JSONObject callCustomCore(Context c, String text, String conversationId) throws Exception {
                  String base = AtlasStore.coreUrl(c).trim();
                  String endpoint = base.endsWith("/") ? base + "api/chat" : base + "/api/chat";
                  JSONObject body = new JSONObject();
                  body.put("text", text);
                  body.put("source", "atlas-android-1.2");
                  body.put("conversationId", conversationId);
                  body.put("context", context(c, conversationId, text));
                  HttpURLConnection h = connection(endpoint);
                  String raw = post(h, body.toString());
                  JSONObject out = new JSONObject(raw);
                  if (!out.has("reply")) out.put("reply", "Done.");
                  if (!out.has("actions")) out.put("actions", new JSONArray());
                  if (!out.has("memories")) out.put("memories", new JSONArray());
                  out.put("provider", "custom-core");
                  return out;
              }
 
              private static JSONObject openAiBody(Context c, String text, String conversationId, String model) throws Exception {
                  JSONObject body = new JSONObject();
                  body.put("model", model);
                  body.put("temperature", 0.2);
                  body.put("max_tokens", 1800);
                  JSONArray messages = new JSONArray();
                  messages.put(message("system", systemPrompt()));
                  messages.put(message("user",
                          "PHONE_CONTEXT:\n" + context(c, conversationId, text).toString() +
                                  "\n\nUSER REQUEST:\n" + text));
                  body.put("messages", messages);
                  return body;
              }
 
              private static JSONObject message(String role, String content) throws Exception {
                  return new JSONObject().put("role", role).put("content", content);
              }
 
              private static JSONObject context(Context c, String conversationId, String request) {
                  JSONObject x = new JSONObject();
                  try {
                      String q = request == null ? "" : request.toLowerCase(Locale.US);
                      boolean needMessages = containsAny(q, "text", "sms", "message", "messages");
                      boolean needNotifications = containsAny(q, "notification", "notifications", "missed", "what did i miss");
                      boolean needCalendar = containsAny(q, "calendar", "schedule", "appointment", "meeting", "event");
                      boolean needLocation = containsAny(q, "where am i", "near me", "nearby", "navigate", "directions", "weather", "location", "traffic");
 
                      x.put("conversationId", conversationId);
                      x.put("timeMillis", System.currentTimeMillis());
                      JSONObject device = DeviceContext.snapshot(c);
                      if (!needLocation) device.remove("location");
                      x.put("device", device);
                      x.put("capabilities", CapabilityManager.snapshot(c));
                      x.put("memories", tail(AtlasStore.memories(c), 40));
                      x.put("recentConversation", tail(AtlasStore.conversation(c), 20));
                      if (needNotifications) x.put("recentNotifications", tail(AtlasStore.notifications(c), 24));
                      if (needCalendar) x.put("upcomingCalendar", CalendarTools.upcoming(c));
                      if (needMessages) x.put("recentSms", SmsTools.recent(c));
                  } catch (Exception ignored) {}
                  return x;
              }
 
              private static boolean containsAny(String s, String... terms) {
                  for (String t : terms) if (s.contains(t)) return true;
                  return false;
              }
 
              private static JSONArray tail(JSONArray a, int max) {
                  JSONArray out = new JSONArray();
                  if (a == null) return out;
                  int start = Math.max(0, a.length() - max);
                  for (int i = start; i < a.length(); i++) out.put(a.opt(i));
                  return out;
              }
 
              private static String systemPrompt() {
                  return "You are Atlas 1.3, the user's personal Android AI core. " +
                          "You are the reasoning and planning layer inside an Android phone agent. " +
                          "Use supplied phone context when relevant and never invent device state. " +
                          "The Android app, not you, enforces permissions and confirmations. " +
                          "Return ONLY one valid JSON object and no markdown. Required schema: " +
                          "{\"reply\":\"natural spoken answer\",\"actions\":[{\"type\":\"action_name\"}],\"memories\":[\"durable user facts/preferences\"]}. " +
                          "Use an empty actions array when no phone action is needed. " +
                          "Use memories only for durable user preferences or facts, never transient chatter. " +
                          "Supported action types: open_app, navigate, web_search, get_location, call_contact, dial_number, send_sms, read_sms, create_calendar_event, " +
                          "media_play, media_pause, media_next, media_previous, volume_up, volume_down, flashlight_on, flashlight_off, open_camera, clipboard_copy, clipboard_read, " +
                          "answer_call, end_call, ui_back, ui_home, ui_recents, ui_notifications, ui_quick_settings, ui_scroll_down, ui_scroll_up, ui_swipe_up, ui_swipe_down, " +
                          "ui_swipe_left, ui_swipe_right, ui_click_text, ui_type_text, ui_screenshot, ui_lock_screen. " +
                          "For multi-step tasks, return actions in execution order. Never claim an action succeeded before the app reports it. " +
                          "If required details are missing, ask the user rather than guessing. " +
                          "For ordinary questions, answer directly with no action. Keep spoken replies concise unless the user asks for detail.";
              }
 
              private static JSONObject normalize(String raw, String provider) throws Exception {
                  String s = raw == null ? "" : raw.trim();
                  if (s.startsWith("```")) {
                      int nl = s.indexOf('\n');
                      if (nl >= 0) s = s.substring(nl + 1);
                      if (s.endsWith("```")) s = s.substring(0, s.length() - 3).trim();
                  }
                  int a = s.indexOf('{');
                  int b = s.lastIndexOf('}');
                  JSONObject out;
                  if (a >= 0 && b > a) {
                      try { out = new JSONObject(s.substring(a, b + 1)); }
                      catch (Exception e) { out = new JSONObject().put("reply", s); }
                  } else {
                      out = new JSONObject().put("reply", s);
                  }
                  if (!out.has("reply")) out.put("reply", "Done.");
                  if (!out.has("actions")) out.put("actions", new JSONArray());
                  if (!out.has("memories")) out.put("memories", new JSONArray());
                  out.put("provider", provider);
                  return out;
              }
 
              private static void sanitizeActions(JSONObject out) throws Exception {
                  JSONArray source = out.optJSONArray("actions");
                  if (source == null) source = new JSONArray();
                  JSONArray clean = new JSONArray();
                  for (int i = 0; i < source.length() && clean.length() < MAX_ACTIONS; i++) {
                      JSONObject action = source.optJSONObject(i);
                      if (action == null) continue;
                      String type = action.optString("type", "").trim();
                      if (ALLOWED_ACTIONS.contains(type)) clean.put(action);
                  }
                  out.put("actions", clean);
 
                  JSONArray memories = out.optJSONArray("memories");
                  if (memories == null) out.put("memories", new JSONArray());
              }
 
              private static HttpURLConnection connection(String endpoint) throws Exception {
                  HttpURLConnection h = (HttpURLConnection) new URL(endpoint).openConnection();
                  h.setConnectTimeout(15000);
                  h.setReadTimeout(65000);
                  h.setRequestMethod("POST");
                  h.setDoOutput(true);
                  h.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                  h.setRequestProperty("Accept", "application/json");
                  return h;
              }
 
              private static String post(HttpURLConnection h, String json) throws Exception {
                  byte[] bytes = json.getBytes(StandardCharsets.UTF_8);
                  try (OutputStream os = h.getOutputStream()) { os.write(bytes); }
                  int code = h.getResponseCode();
                  InputStream in = code >= 200 && code < 300 ? h.getInputStream() : h.getErrorStream();
                  String body = readAll(in);
                  h.disconnect();
                  if (code < 200 || code >= 300) throw new Exception("HTTP " + code + " " + trim(body, 260));
                  return body;
              }
 
              private static String readAll(InputStream in) throws Exception {
                  if (in == null) return "";
                  BufferedReader br = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = br.readLine()) != null) sb.append(line);
                  return sb.toString();
              }
 
              private static String trim(String s, int max) {
                  if (s == null) return "";
                  String x = s.replace('\n', ' ').replace('\r', ' ').trim();
                  return x.length() <= max ? x : x.substring(0, max);
              }
 
              private static String shortError(Exception e) {
                  return trim(e == null ? "unknown" : e.getMessage(), 160);
              }
 
              private static void recordSuccess(Context c, String provider) {
                  c.getSharedPreferences(HEALTH_PREF, Context.MODE_PRIVATE).edit()
                          .putString("last_provider", provider)
                          .putLong("last_success", System.currentTimeMillis())
                          .remove("last_error")
                          .apply();
              }
 
              private static void recordFailure(Context c, String provider, Exception e) {
                  c.getSharedPreferences(HEALTH_PREF, Context.MODE_PRIVATE).edit()
                          .putString("last_error_provider", provider)
                          .putString("last_error", shortError(e))
                          .putLong("last_error_time", System.currentTimeMillis())
                          .apply();
              }
