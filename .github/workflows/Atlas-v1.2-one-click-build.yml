                      try { research = callGroqResearch(c, request); }
                      catch (Exception e) { errors.add("Groq research: " + shortError(e)); }
                  }
                  if (SecureStore.has(c, "gemini_key")) {
                      try { return finish(c, parse(callGemini(c, request, feedback, research, conversationId), "gemini-3.8-flash")); }
                      catch (Exception e) { errors.add("Gemini: " + shortError(e)); recordFailure(c, "gemini-3.8-flash", e); }
                  }
                  if (SecureStore.has(c, "openrouter_key")) {
                      try { return finish(c, parse(callOpenRouter(c, request, feedback, research, conversationId), "openrouter-free")); }
