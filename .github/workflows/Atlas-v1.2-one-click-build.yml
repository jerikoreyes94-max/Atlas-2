              private static JSONObject decide(Context c, String request, String feedback, String conversationId) throws Exception {
                  request = request == null ? "" : request.trim();
                  if (request.isEmpty()) return empty("What do you want me to handle?");
                  List<String> errors = new ArrayList<>();
                  String research = "";
