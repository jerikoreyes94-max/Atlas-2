              private static JSONObject context(Context c, String conversationId, String request) {
                  JSONObject x = new JSONObject();
                  try {
                      String q = request == null ? "" : request.toLowerCase(Locale.US);
                      boolean messages = containsAny(q, "text", "sms", "message", "wife", "husband", "call", "contact");
                      boolean notifs = containsAny(q, "notification", "missed", "what did i miss", "work", "email", "teams");
                      boolean calendar = containsAny(q, "calendar", "schedule", "appointment", "meeting", "event", "tomorrow", "today", "week");
                      boolean location = containsAny(q, "where am i", "near me", "nearby", "navigate", "directions", "weather", "location", "home", "work");
                      x.put("conversationId", conversationId);
                      x.put("timeMillis", System.currentTimeMillis());
                      x.put("timezone", java.util.TimeZone.getDefault().getID());
                      JSONObject device = DeviceContext.snapshot(c);
                      if (!location) device.remove("location");
                      x.put("device", device);
                      x.put("capabilities", CapabilityManager.snapshot(c));
                      x.put("memories", tail(AtlasStore.memories(c), 80));
                      x.put("recentConversation", tail(AtlasStore.conversation(c), 30));
                      x.put("automations", AtlasAutomations.snapshot(c));
                      x.put("contactRules", AtlasAutomations.rulesSnapshot(c));
                      x.put("delegatedCallStatus", VoiceAgentBridge.lastStatus(c));
                      if (notifs) x.put("recentNotifications", tail(AtlasStore.notifications(c), 35));
                      if (calendar) x.put("upcomingCalendar", CalendarTools.upcoming(c));
                      if (messages) x.put("recentSms", SmsTools.recent(c));
                  } catch (Exception ignored) {}
                  return x;
              }
 
              private static String systemPrompt() {
                  return "You are Atlas 1.3, a persistent personal Android life agent, not a chatbot. Your job is to understand intent, plan, act through phone tools, remember durable facts, create future automations when requested, and verify real action results before claiming completion. " +
                          "Return ONLY one JSON object with schema {reply:string, actions:array, memories:array, continue:boolean}. Use continue=true only when the real results of the returned actions are needed before you can finish or choose the next step. " +
                          "The Android app enforces permissions and user confirmation for consequential actions, so do not waste the reply asking for confirmation when you already have enough details; request the action and let the local policy ask. Never invent device state or action success. " +
                          "You may handle multi-step tasks and life routines. Supported actions: " +
                          "open_app{app}; navigate{query}; web_search{query}; get_location{}; call_contact{target}; dial_number{number}; send_sms{target,message}; read_sms{}; " +
                          "create_calendar_event{title,startMillis,endMillis,location}; media_play{}; media_pause{}; media_next{}; media_previous{}; volume_up{}; volume_down{}; flashlight_on{}; flashlight_off{}; open_camera{}; clipboard_copy{text}; clipboard_read{}; " +
                          "answer_call{}; end_call{}; ui_back{}; ui_home{}; ui_recents{}; ui_notifications{}; ui_quick_settings{}; ui_scroll_down{}; ui_scroll_up{}; ui_swipe_up{}; ui_swipe_down{}; ui_swipe_left{}; ui_swipe_right{}; ui_click_text{target}; ui_type_text{text}; ui_screenshot{}; ui_lock_screen{}; " +
                          "schedule_sms{target,message,whenMillis,repeat}; schedule_call{target,objective,whenMillis,mode,repeat}; delegate_call{target,objective,intro}; list_automations{}; cancel_automation{id}; set_contact_rule{target,incomingPolicy,missedCallMessage}; set_event_rule{event,contains,target,message,objective,action}; get_delegated_call_status{}. " +
                          "repeat may be none,daily,weekdays,weekly. incomingPolicy may be ask,allow,silence,reject. set_event_rule event currently supports notification_contains and action supports send_sms or delegate_call. " +
                          "delegate_call means Atlas's remote voice agent calls the person and converses on the user's behalf about the stated objective; it must identify itself as the user's AI assistant and never impersonate the user. " +
                          "For scheduled or recurring behavior, create the automation rather than merely promising to remember. For relative times, calculate whenMillis from the supplied timeMillis/timezone. If a contact or critical detail is genuinely missing, ask briefly instead of guessing. " +
                          "Use memories only for durable facts/preferences/relationships/routines that will matter later. Keep spoken replies concise unless the user asks for detail.";
              }
 
              private static boolean needsFreshWeb(String text) {
                  String s = text.toLowerCase(Locale.US);
                  String[] terms = {"today", "latest", "current", "news", "weather", "score", "price", "open now", "right now", "traffic", "stock", "market", "look online", "search the web", "find online"};
                  for (String term : terms) if (s.contains(term)) return true;
                  return false;
              }
 
              private static boolean containsAny(String s, String... terms) {
                  for (String term : terms) if (s.contains(term)) return true;
                  return false;
              }
 
              private static JSONArray tail(JSONArray a, int max) {
                  JSONArray out = new JSONArray();
                  if (a == null) return out;
                  for (int i = Math.max(0, a.length() - max); i < a.length(); i++) out.put(a.opt(i));
                  return out;
              }
 
              private static JSONObject parse(String raw, String provider) throws Exception {
                  String s = raw == null ? "" : raw.trim();
                  if (s.startsWith("```")) {
                      int nl = s.indexOf('\n');
                      if (nl >= 0) s = s.substring(nl + 1);
                      if (s.endsWith("```")) s = s.substring(0, s.length() - 3).trim();
                  }
                  int a = s.indexOf('{');
                  int b = s.lastIndexOf('}');
                  JSONObject out;
                  if (a >= 0 && b > a) {
                      try { out = new JSONObject(s.substring(a, b + 1)); }
                      catch (Exception e) { out = new JSONObject().put("reply", s); }
                  } else out = new JSONObject().put("reply", s);
                  if (!out.has("reply")) out.put("reply", "");
                  if (!out.has("actions")) out.put("actions", new JSONArray());
                  if (!out.has("memories")) out.put("memories", new JSONArray());
                  if (!out.has("continue")) out.put("continue", false);
                  out.put("provider", provider);
                  return out;
              }
 
              private static JSONObject finish(Context c, JSONObject out) throws Exception {
                  JSONArray source = out.optJSONArray("actions");
                  JSONArray clean = new JSONArray();
                  if (source != null) {
                      for (int i = 0; i < source.length() && clean.length() < MAX_ACTIONS; i++) {
                          JSONObject action = source.optJSONObject(i);
                          if (action != null && ALLOWED_ACTIONS.contains(action.optString("type", ""))) clean.put(action);
                      }
                  }
                  out.put("actions", clean);
                  if (out.optJSONArray("memories") == null) out.put("memories", new JSONArray());
                  recordSuccess(c, out.optString("provider", "core"));
                  return out;
              }
 
              private static JSONObject empty(String reply) throws Exception {
                  return new JSONObject().put("reply", reply).put("actions", new JSONArray()).put("memories", new JSONArray()).put("continue", false).put("provider", "local");
              }
 
              private static HttpURLConnection connection(String endpoint) throws Exception {
                  HttpURLConnection h = (HttpURLConnection) new URL(endpoint).openConnection();
                  h.setConnectTimeout(15000);
                  h.setReadTimeout(70000);
                  h.setRequestMethod("POST");
                  h.setDoOutput(true);
                  h.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                  h.setRequestProperty("Accept", "application/json");
                  return h;
              }
 
              private static String post(HttpURLConnection h, String json) throws Exception {
                  try (OutputStream os = h.getOutputStream()) { os.write(json.getBytes(StandardCharsets.UTF_8)); }
                  int code = h.getResponseCode();
                  InputStream in = code >= 200 && code < 300 ? h.getInputStream() : h.getErrorStream();
                  String body = readAll(in);
                  h.disconnect();
                  if (code < 200 || code >= 300) throw new Exception("HTTP " + code + " " + trim(body, 300));
                  return body;
              }
 
              private static String readAll(InputStream in) throws Exception {
                  if (in == null) return "";
                  BufferedReader br = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = br.readLine()) != null) sb.append(line);
                  return sb.toString();
              }
 
              private static String trim(String s, int max) {
                  if (s == null) return "";
                  s = s.replace('\n', ' ').replace('\r', ' ').trim();
                  return s.length() <= max ? s : s.substring(0, max);
              }
 
              private static String shortError(Exception e) { return trim(e == null ? "unknown" : e.getMessage(), 160); }
 
              private static void recordSuccess(Context c, String provider) {
                  c.getSharedPreferences(HEALTH_PREF, Context.MODE_PRIVATE).edit().putString("last_provider", provider).putLong("last_success", System.currentTimeMillis()).remove("last_error").apply();
              }
 
              private static void recordFailure(Context c, String provider, Exception e) {
                  c.getSharedPreferences(HEALTH_PREF, Context.MODE_PRIVATE).edit().putString("last_error_provider", provider).putString("last_error", shortError(e)).putLong("last_error_time", System.currentTimeMillis()).apply();
              }
          }
