name: Build Atlas v3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create Atlas v3 project
        shell: bash
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/atlas/personalai app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AtlasV3"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.atlas.personalai'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.atlas.personalai'
                  minSdk 29
                  targetSdk 36
                  versionCode 300
                  versionName '3.0.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Atlas</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/voice_interaction_service.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <voice-interaction-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:sessionService="com.atlas.personalai.AtlasVoiceInteractionSessionService"
              android:supportsAssist="true"
              android:supportsLaunchVoiceAssistFromKeyguard="true" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <application
                  android:allowBackup="false"
                  android:label="Atlas"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AtlasNotificationListener"
                      android:label="Atlas Notification Access"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".AtlasForegroundService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />

                  <service
                      android:name=".AtlasVoiceInteractionService"
                      android:label="Atlas"
                      android:permission="android.permission.BIND_VOICE_INTERACTION"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.voice.VoiceInteractionService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.voice_interaction"
                          android:resource="@xml/voice_interaction_service" />
                  </service>

                  <service
                      android:name=".AtlasVoiceInteractionSessionService"
                      android:permission="android.permission.BIND_VOICE_INTERACTION"
                      android:exported="true" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasStore.java <<'EOF'
          package com.atlas.personalai;

          import android.content.Context;
          import android.content.SharedPreferences;
          import org.json.JSONArray;

          public final class AtlasStore {
              private static final String PREF = "atlas_v3";
              private AtlasStore() {}

              static SharedPreferences p(Context c) {
                  return c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }

              public static String coreUrl(Context c) {
                  return p(c).getString("core_url", "").trim();
              }

              public static void setCoreUrl(Context c, String s) {
                  p(c).edit().putString(
                      "core_url",
                      s == null ? "" : s.trim()
                  ).apply();
              }

              public static JSONArray memories(Context c) {
                  try {
                      return new JSONArray(
                          p(c).getString("memories", "[]")
                      );
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              public static void remember(Context c, String text) {
                  JSONArray a = memories(c);
                  a.put(text);

                  while (a.length() > 50) {
                      a.remove(0);
                  }

                  p(c).edit()
                      .putString("memories", a.toString())
                      .apply();
              }

              public static JSONArray notifications(Context c) {
                  try {
                      return new JSONArray(
                          p(c).getString("notifications", "[]")
                      );
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              public static void addNotification(
                  Context c,
                  String text
              ) {
                  JSONArray a = notifications(c);
                  a.put(text);

                  while (a.length() > 100) {
                      a.remove(0);
                  }

                  p(c).edit()
                      .putString("notifications", a.toString())
                      .apply();
              }
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasNotificationListener.java <<'EOF'
          package com.atlas.personalai;

          import android.app.Notification;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          public class AtlasNotificationListener
              extends NotificationListenerService {

              @Override
              public void onNotificationPosted(
                  StatusBarNotification sbn
              ) {
                  try {
                      Notification n = sbn.getNotification();

                      CharSequence title =
                          n.extras.getCharSequence(
                              Notification.EXTRA_TITLE,
                              ""
                          );

                      CharSequence text =
                          n.extras.getCharSequence(
                              Notification.EXTRA_TEXT,
                              ""
                          );

                      AtlasStore.addNotification(
                          this,
                          sbn.getPackageName()
                              + " | "
                              + title
                              + " | "
                              + text
                      );

                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasForegroundService.java <<'EOF'
          package com.atlas.personalai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.IBinder;

          public class AtlasForegroundService extends Service {

              private static final String CH = "atlas_core";

              @Override
              public void onCreate() {
                  super.onCreate();

                  NotificationManager nm =
                      getSystemService(
                          NotificationManager.class
                      );

                  nm.createNotificationChannel(
                      new NotificationChannel(
                          CH,
                          "Atlas Core",
                          NotificationManager.IMPORTANCE_LOW
                      )
                  );

                  Notification n =
                      new Notification.Builder(this, CH)
                          .setContentTitle("Atlas is active")
                          .setContentText(
                              "Voice + Brain ready"
                          )
                          .setSmallIcon(
                              android.R.drawable
                                  .ic_btn_speak_now
                          )
                          .build();

                  startForeground(300, n);
              }

              @Override
              public int onStartCommand(
                  Intent i,
                  int flags,
                  int id
              ) {
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasVoiceInteractionService.java <<'EOF'
          package com.atlas.personalai;

          import android.service.voice.VoiceInteractionService;

          public class AtlasVoiceInteractionService
              extends VoiceInteractionService {
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasVoiceInteractionSessionService.java <<'EOF'
          package com.atlas.personalai;

          import android.service.voice.VoiceInteractionSession;
          import android.service.voice.VoiceInteractionSessionService;

          public class AtlasVoiceInteractionSessionService
              extends VoiceInteractionSessionService {

              @Override
              public VoiceInteractionSession onNewSession(
                  android.os.Bundle args
              ) {
                  return new AtlasVoiceInteractionSession(
                      this
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/AtlasVoiceInteractionSession.java <<'EOF'
          package com.atlas.personalai;

          import android.content.Context;
          import android.content.Intent;
          import android.service.voice.VoiceInteractionSession;

          public class AtlasVoiceInteractionSession
              extends VoiceInteractionSession {

              public AtlasVoiceInteractionSession(
                  Context c
              ) {
                  super(c);
              }

              @Override
              public void onShow(
                  android.os.Bundle args,
                  int flags
              ) {
                  super.onShow(args, flags);

                  try {
                      Intent i =
                          new Intent(
                              getContext(),
                              MainActivity.class
                          );

                      i.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                              | Intent.FLAG_ACTIVITY_SINGLE_TOP
                      );

                      getContext().startActivity(i);

                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat > app/src/main/java/com/atlas/personalai/MainActivity.java <<'EOF'
          package com.atlas.personalai;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.UUID;

          public class MainActivity
              extends Activity
              implements TextToSpeech.OnInitListener {

              private static final int MIC = 10;

              private TextView status;
              private TextView heard;
              private TextView reply;

              private EditText core;

              private SpeechRecognizer sr;
              private TextToSpeech tts;

              private final String conversationId =
                  UUID.randomUUID().toString();

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  buildUi();

                  tts =
                      new TextToSpeech(
                          this,
                          this
                      );

                  startService(
                      new Intent(
                          this,
                          AtlasForegroundService.class
                      )
                  );

                  if (
                      android.os.Build.VERSION.SDK_INT >= 33
                      && checkSelfPermission(
                          Manifest.permission
                              .POST_NOTIFICATIONS
                      )
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(
                          new String[] {
                              Manifest.permission
                                  .POST_NOTIFICATIONS
                          },
                          11
                      );
                  }
              }

              private TextView tv(
                  String s,
                  int sp
              ) {
                  TextView v =
                      new TextView(this);

                  v.setText(s);
                  v.setTextSize(sp);
                  v.setPadding(
                      20,
                      16,
                      20,
                      16
                  );

                  return v;
              }

              private void buildUi() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      28,
                      28,
                      28,
                      28
                  );

                  TextView title =
                      tv(
                          "ATLAS v3",
                          30
                      );

                  title.setTypeface(
                      Typeface.DEFAULT_BOLD
                  );

                  title.setGravity(
                      Gravity.CENTER_HORIZONTAL
                  );

                  root.addView(title);

                  status =
                      tv(
                          "IDLE — local voice brain ready",
                          16
                      );

                  root.addView(status);

                  core =
                      new EditText(this);

                  core.setHint(
                      "Atlas Core URL (optional)"
                  );

                  core.setSingleLine(true);

                  core.setText(
                      AtlasStore.coreUrl(this)
                  );

                  root.addView(core);

                  Button save =
                      new Button(this);

                  save.setText(
                      "SAVE CORE URL"
                  );

                  save.setOnClickListener(
                      v -> {
                          AtlasStore.setCoreUrl(
                              this,
                              core.getText()
                                  .toString()
                          );

                          toast(
                              "Core URL saved"
                          );
                      }
                  );

                  root.addView(save);

                  Button speak =
                      new Button(this);

                  speak.setText(
                      "TALK TO ATLAS"
                  );

                  speak.setOnClickListener(
                      v -> listen()
                  );

                  root.addView(speak);

                  Button test =
                      new Button(this);

                  test.setText(
                      "TEST VOICE"
                  );

                  test.setOnClickListener(
                      v -> say(
                          "Atlas voice is online."
                      )
                  );

                  root.addView(test);

                  heard =
                      tv(
                          "You: —",
                          16
                      );

                  root.addView(heard);

                  reply =
                      tv(
                          "Atlas: —",
                          17
                      );

                  reply.setTypeface(
                      Typeface.DEFAULT_BOLD
                  );

                  root.addView(reply);

                  TextView hint =
                      tv(
                          "Say: remember buy dog food\n"
                          + "Or configure Atlas Core "
                          + "and ask anything.",
                          14
                      );

                  root.addView(hint);

                  ScrollView scroll =
                      new ScrollView(this);

                  scroll.addView(root);

                  setContentView(scroll);
              }

              private void listen() {

                  if (
                      !SpeechRecognizer
                          .isRecognitionAvailable(this)
                  ) {
                      toast(
                          "Speech recognition unavailable"
                      );

                      return;
                  }

                  if (
                      checkSelfPermission(
                          Manifest.permission.RECORD_AUDIO
                      )
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(
                          new String[] {
                              Manifest.permission.RECORD_AUDIO
                          },
                          MIC
                      );

                      return;
                  }

                  if (sr != null) {
                      sr.destroy();
                  }

                  sr =
                      SpeechRecognizer
                          .createSpeechRecognizer(this);

                  sr.setRecognitionListener(
                      new RecognitionListener() {

                          public void onReadyForSpeech(
                              Bundle p
                          ) {
                              status.setText(
                                  "LISTENING"
                              );
                          }

                          public void onBeginningOfSpeech() {}

                          public void onRmsChanged(
                              float r
                          ) {}

                          public void onBufferReceived(
                              byte[] b
                          ) {}

                          public void onEndOfSpeech() {
                              status.setText(
                                  "THINKING"
                              );
                          }

                          public void onError(
                              int e
                          ) {
                              status.setText(
                                  "ERROR " + e
                              );
                          }

                          public void onResults(
                              Bundle r
                          ) {
                              ArrayList<String> list =
                                  r.getStringArrayList(
                                      SpeechRecognizer
                                          .RESULTS_RECOGNITION
                                  );

                              if (
                                  list != null
                                  && !list.isEmpty()
                              ) {
                                  process(
                                      list.get(0)
                                  );
                              } else {
                                  status.setText(
                                      "IDLE"
                                  );
                              }
                          }

                          public void onPartialResults(
                              Bundle p
                          ) {}

                          public void onEvent(
                              int t,
                              Bundle p
                          ) {}
                      }
                  );

                  Intent i =
                      new Intent(
                          RecognizerIntent
                              .ACTION_RECOGNIZE_SPEECH
                      );

                  i.putExtra(
                      RecognizerIntent
                          .EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent
                          .LANGUAGE_MODEL_FREE_FORM
                  );

                  i.putExtra(
                      RecognizerIntent
                          .EXTRA_LANGUAGE,
                      Locale.getDefault()
                  );

                  sr.startListening(i);
              }

              private void process(
                  String text
              ) {

                  heard.setText(
                      "You: " + text
                  );

                  String low =
                      text.toLowerCase(
                          Locale.US
                      ).trim();

                  if (
                      low.startsWith(
                          "remember "
                      )
                  ) {
                      String m =
                          text.substring(9)
                              .trim();

                      AtlasStore.remember(
                          this,
                          m
                      );

                      answer(
                          "Got it. I'll remember "
                              + m
                      );

                      return;
                  }

                  String base =
                      AtlasStore.coreUrl(this);

                  if (base.isEmpty()) {

                      answer(
                          "I heard you. "
                          + "Atlas voice and local memory "
                          + "are working. "
                          + "Add your Atlas Core URL "
                          + "to turn on cloud intelligence."
                      );

                      return;
                  }

                  new Thread(
                      () -> callCore(
                          base,
                          text
                      )
                  ).start();
              }

              private void callCore(
                  String base,
                  String text
              ) {
                  try {

                      String endpoint =
                          base.endsWith("/")
                              ? base + "api/chat"
                              : base + "/api/chat";

                      JSONObject body =
                          new JSONObject();

                      body.put(
                          "text",
                          text
                      );

                      body.put(
                          "device",
                          "Titan 2"
                      );

                      body.put(
                          "source",
                          "voice"
                      );

                      body.put(
                          "conversationId",
                          conversationId
                      );

                      JSONObject ctx =
                          new JSONObject();

                      ctx.put(
                          "recentNotifications",
                          AtlasStore.notifications(
                              this
                          )
                      );

                      ctx.put(
                          "localMemories",
                          AtlasStore.memories(
                              this
                          )
                      );

                      body.put(
                          "context",
                          ctx
                      );

                      byte[] bytes =
                          body.toString()
                              .getBytes(
                                  StandardCharsets.UTF_8
                              );

                      HttpURLConnection c =
                          (HttpURLConnection)
                              new URL(
                                  endpoint
                              ).openConnection();

                      c.setConnectTimeout(
                          12000
                      );

                      c.setReadTimeout(
                          25000
                      );

                      c.setRequestMethod(
                          "POST"
                      );

                      c.setDoOutput(true);

                      c.setRequestProperty(
                          "Content-Type",
                          "application/json"
                      );

                      try (
                          OutputStream os =
                              c.getOutputStream()
                      ) {
                          os.write(bytes);
                      }

                      int code =
                          c.getResponseCode();

                      BufferedReader br =
                          new BufferedReader(
                              new InputStreamReader(
                                  code >= 200
                                      && code < 300
                                      ? c.getInputStream()
                                      : c.getErrorStream()
                              )
                          );

                      StringBuilder sb =
                          new StringBuilder();

                      String line;

                      while (
                          (line = br.readLine())
                          != null
                      ) {
                          sb.append(line);
                      }

                      if (
                          code < 200
                          || code >= 300
                      ) {
                          throw new Exception(
                              "Core HTTP "
                                  + code
                                  + " "
                                  + sb
                          );
                      }

                      JSONObject out =
                          new JSONObject(
                              sb.toString()
                          );

                      answer(
                          out.optString(
                              "reply",
                              "Atlas Core returned no reply."
                          )
                      );

                  } catch (Exception e) {

                      answer(
                          "Core error: "
                              + e.getMessage()
                      );
                  }
              }

              private void answer(
                  String s
              ) {
                  runOnUiThread(
                      () -> {
                          reply.setText(
                              "Atlas: " + s
                          );

                          status.setText(
                              "SPEAKING"
                          );

                          say(s);
                      }
                  );
              }

              private void say(
                  String s
              ) {
                  if (tts != null) {
                      tts.speak(
                          s,
                          TextToSpeech
                              .QUEUE_FLUSH,
                          null,
                          "atlas"
                      );
                  }
              }

              private void toast(
                  String s
              ) {
                  Toast.makeText(
                      this,
                      s,
                      Toast.LENGTH_SHORT
                  ).show();
              }

              @Override
              public void onInit(
                  int x
              ) {
                  if (
                      x == TextToSpeech.SUCCESS
                  ) {
                      tts.setLanguage(
                          Locale.getDefault()
                      );

                      status.setText(
                          "IDLE — voice ready"
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                  int r,
                  String[] p,
                  int[] g
              ) {
                  super.onRequestPermissionsResult(
                      r,
                      p,
                      g
                  );

                  if (
                      r == MIC
                      && g.length > 0
                      && g[0]
                          == PackageManager
                              .PERMISSION_GRANTED
                  ) {
                      listen();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (sr != null) {
                      sr.destroy();
                  }

                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare Atlas-v3.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Atlas-v3.apk
          sha256sum dist/Atlas-v3.apk > dist/Atlas-v3.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-v3-apk
          path: |
            dist/Atlas-v3.apk
            dist/Atlas-v3.sha256
          if-no-files-found: error
