ATLAS
          base64 -d /tmp/atlas-v5.b64 > /tmp/atlas-v5.tar.xz
          tar -xJf /tmp/atlas-v5.tar.xz
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Atlas-v5.apk
          apksigner verify --verbose --print-certs dist/Atlas-v5.apk | tee dist/signer.txt
          sha256sum dist/Atlas-v5.apk | tee dist/Atlas-v5.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-v5-apk
          path: |
            dist/Atlas-v5.apk
            dist/Atlas-v5.sha256
            dist/signer.txt
          if-no-files-found: error
