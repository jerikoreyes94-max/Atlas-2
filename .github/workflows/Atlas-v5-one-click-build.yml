          cat > 'app/src/main/java/com/atlas/personalai/AtlasStore.java' <<'ATLAS_FILE_12'
          package com.atlas.personalai;
          
          import android.content.Context;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          public final class AtlasStore {
              private static final String PREF = "atlas_v4";
              private AtlasStore() {}
          
              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }
          
              public static String coreUrl(Context c) { return p(c).getString("core_url", "").trim(); }
              public static void setCoreUrl(Context c, String s) { p(c).edit().putString("core_url", s == null ? "" : s.trim()).apply(); }
              public static String voiceName(Context c) { return p(c).getString("voice_name", ""); }
              public static void setVoiceName(Context c, String s) { p(c).edit().putString("voice_name", s == null ? "" : s).apply(); }
              public static float speechRate(Context c) { return p(c).getFloat("speech_rate", 0.93f); }
              public static void setSpeechRate(Context c, float v) { p(c).edit().putFloat("speech_rate", v).apply(); }
              public static float pitch(Context c) { return p(c).getFloat("pitch", 0.97f); }
              public static void setPitch(Context c, float v) { p(c).edit().putFloat("pitch", v).apply(); }
              public static boolean conversationMode(Context c) { return p(c).getBoolean("conversation_mode", true); }
              public static void setConversationMode(Context c, boolean v) { p(c).edit().putBoolean("conversation_mode", v).apply(); }
          
              public static JSONArray memories(Context c) {
                  try { return new JSONArray(p(c).getString("memories", "[]")); }
                  catch (Exception e) { return new JSONArray(); }
              }
          
              public static void remember(Context c, String text) {
                  JSONArray a = memories(c);
                  a.put(text);
                  while (a.length() > 250) a.remove(0);
                  p(c).edit().putString("memories", a.toString()).apply();
              }
          
              public static JSONArray notifications(Context c) {
                  try { return new JSONArray(p(c).getString("notifications", "[]")); }
                  catch (Exception e) { return new JSONArray(); }
              }
          
              public static void addNotification(Context c, String text) {
                  JSONArray a = notifications(c);
                  a.put(text);
                  while (a.length() > 250) a.remove(0);
                  p(c).edit().putString("notifications", a.toString()).apply();
              }
          
              public static JSONArray conversation(Context c) {
                  try { return new JSONArray(p(c).getString("conversation", "[]")); }
                  catch (Exception e) { return new JSONArray(); }
              }
          
              public static void addTurn(Context c, String role, String text) {
                  try {
                      JSONArray a = conversation(c);
                      JSONObject o = new JSONObject();
                      o.put("role", role);
                      o.put("text", text);
                      o.put("time", System.currentTimeMillis());
                      a.put(o);
                      while (a.length() > 80) a.remove(0);
                      p(c).edit().putString("conversation", a.toString()).apply();
                  } catch (Exception ignored) {}
              }
          
              public static void clearConversation(Context c) {
                  p(c).edit().putString("conversation", "[]").apply();
              }
          }
          ATLAS_FILE_12

          cat > 'app/src/main/java/com/atlas/personalai/ContactTools.java' <<'ATLAS_FILE_13'
          package com.atlas.personalai;
          
          import android.Manifest;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.provider.ContactsContract;
          
          public final class ContactTools {
              private ContactTools() {}
          
              public static ContactHit find(Context c, String target) {
                  if (c.checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return null;
                  Cursor cur = null;
                  try {
                      cur = c.getContentResolver().query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER},
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?",
                          new String[]{"%" + target + "%"},
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                      );
                      ContactHit first = null;
                      while (cur != null && cur.moveToNext()) {
                          ContactHit h = new ContactHit(cur.getString(0), cur.getString(1));
                          if (first == null) first = h;
                          if (h.name.equalsIgnoreCase(target)) return h;
                      }
                      return first;
                  } catch (Exception e) { return null; }
                  finally { if (cur != null) cur.close(); }
              }
          
              public static String last4(String s) {
                  String d = s == null ? "" : s.replaceAll("\\D", "");
                  return d.length() <= 4 ? d : d.substring(d.length() - 4);
              }
          
              public static final class ContactHit {
                  public final String name;
                  public final String number;
                  public ContactHit(String n, String p) { name = n; number = p; }
              }
          }
          ATLAS_FILE_13

          cat > 'app/src/main/java/com/atlas/personalai/DeviceContext.java' <<'ATLAS_FILE_14'
          package com.atlas.personalai;
          
          import android.Manifest;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationManager;
          import android.net.ConnectivityManager;
          import android.net.NetworkCapabilities;
          import android.os.BatteryManager;
          import org.json.JSONObject;
          
          public final class DeviceContext {
              private DeviceContext() {}
          
              public static JSONObject snapshot(Context c) {
                  JSONObject o = new JSONObject();
                  try {
                      BatteryManager bm = (BatteryManager)c.getSystemService(Context.BATTERY_SERVICE);
                      o.put("batteryPercent", bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY));
                      o.put("charging", bm.isCharging());
                      o.put("network", network(c));
                      o.put("timeMillis", System.currentTimeMillis());
                      o.put("location", locationJson(c));
                      o.put("screen", AtlasAccessibilityService.screenSnapshot());
                  } catch (Exception ignored) {}
                  return o;
              }
          
              public static String batterySummary(Context c) {
                  try {
                      BatteryManager bm = (BatteryManager)c.getSystemService(Context.BATTERY_SERVICE);
                      int pct = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY);
                      return "Battery is at " + pct + " percent" + (bm.isCharging() ? " and charging." : ".");
                  } catch (Exception e) { return "I couldn't read the battery right now."; }
              }
          
              private static String network(Context c) {
                  try {
                      ConnectivityManager cm = (ConnectivityManager)c.getSystemService(Context.CONNECTIVITY_SERVICE);
                      NetworkCapabilities nc = cm.getNetworkCapabilities(cm.getActiveNetwork());
                      if (nc == null) return "offline";
                      if (nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) return "wifi";
                      if (nc.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)) return "cellular";
                      if (nc.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET)) return "ethernet";
                      return "connected";
                  } catch (Exception e) { return "unknown"; }
              }
          
              public static JSONObject locationJson(Context c) {
                  JSONObject o = new JSONObject();
                  try {
                      if (c.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                          c.checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          o.put("available", false);
                          return o;
                      }
                      LocationManager lm = (LocationManager)c.getSystemService(Context.LOCATION_SERVICE);
                      Location best = null;
                      for (String p : lm.getProviders(true)) {
                          try {
                              Location x = lm.getLastKnownLocation(p);
                              if (x != null && (best == null || x.getTime() > best.getTime())) best = x;
                          } catch (Exception ignored) {}
                      }
                      if (best == null) { o.put("available", false); return o; }
                      o.put("available", true);
                      o.put("lat", best.getLatitude());
                      o.put("lon", best.getLongitude());
                      o.put("accuracyMeters", best.getAccuracy());
                      o.put("ageMs", Math.max(0, System.currentTimeMillis() - best.getTime()));
                  } catch (Exception e) {
                      try { o.put("available", false); } catch (Exception ignored) {}
                  }
                  return o;
              }
          
              public static String locationSummary(Context c) {
                  try {
                      JSONObject o = locationJson(c);
                      if (!o.optBoolean("available")) return "Location isn't available yet. Grant location access and try again.";
                      return String.format(java.util.Locale.US,
                          "Your last known location is %.5f, %.5f with about %.0f meter accuracy.",
                          o.optDouble("lat"), o.optDouble("lon"), o.optDouble("accuracyMeters"));
                  } catch (Exception e) { return "I couldn't read your location."; }
              }
          }
          ATLAS_FILE_14

          cat > 'app/src/main/java/com/atlas/personalai/CalendarTools.java' <<'ATLAS_FILE_15'
          package com.atlas.personalai;
          
          import android.Manifest;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.provider.CalendarContract;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.text.DateFormat;
          import java.util.Date;
          import java.util.TimeZone;
          
          public final class CalendarTools {
              private CalendarTools() {}
          
              public static JSONArray upcoming(Context c) {
                  JSONArray out = new JSONArray();
                  if (c.checkSelfPermission(Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) return out;
                  Cursor cur = null;
                  try {
                      long now = System.currentTimeMillis();
                      long end = now + 7L * 24L * 60L * 60L * 1000L;
                      cur = c.getContentResolver().query(
                          CalendarContract.Events.CONTENT_URI,
                          new String[]{CalendarContract.Events.TITLE, CalendarContract.Events.DTSTART,
                              CalendarContract.Events.DTEND, CalendarContract.Events.EVENT_LOCATION},
                          CalendarContract.Events.DTSTART + ">=? AND " + CalendarContract.Events.DTSTART + "<=?",
                          new String[]{String.valueOf(now), String.valueOf(end)},
                          CalendarContract.Events.DTSTART + " ASC"
                      );
                      int count = 0;
                      while (cur != null && cur.moveToNext() && count < 12) {
                          JSONObject o = new JSONObject();
                          o.put("title", cur.getString(0));
                          o.put("startMillis", cur.getLong(1));
                          o.put("endMillis", cur.getLong(2));
                          o.put("location", cur.getString(3));
                          out.put(o);
                          count++;
                      }
                  } catch (Exception ignored) {
                  } finally { if (cur != null) cur.close(); }
                  return out;
              }
          
              public static String summary(Context c) {
                  JSONArray a = upcoming(c);
                  if (c.checkSelfPermission(Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED)
                      return "Calendar access isn't granted yet. Tap Grant Phone Access.";
                  if (a.length() == 0) return "I don't see anything on your calendar in the next seven days.";
                  StringBuilder s = new StringBuilder("Your next events are. ");
                  DateFormat df = DateFormat.getDateTimeInstance(DateFormat.SHORT, DateFormat.SHORT);
                  for (int i = 0; i < Math.min(6, a.length()); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (i > 0) s.append(". ");
                      s.append(o.optString("title", "Event")).append(" at ").append(df.format(new Date(o.optLong("startMillis"))));
                  }
                  return s.toString();
              }
          
              private static long writableCalendarId(Context c) {
                  Cursor cur = null;
                  try {
                      cur = c.getContentResolver().query(CalendarContract.Calendars.CONTENT_URI,
                          new String[]{CalendarContract.Calendars._ID},
                          CalendarContract.Calendars.VISIBLE + "=1 AND " + CalendarContract.Calendars.CALENDAR_ACCESS_LEVEL + ">=?",
                          new String[]{String.valueOf(CalendarContract.Calendars.CAL_ACCESS_CONTRIBUTOR)}, null);
                      if (cur != null && cur.moveToFirst()) return cur.getLong(0);
                  } catch (Exception ignored) {} finally { if (cur != null) cur.close(); }
                  return -1;
              }
          
              public static String createEvent(Context c, JSONObject a) {
                  if (c.checkSelfPermission(Manifest.permission.WRITE_CALENDAR) != PackageManager.PERMISSION_GRANTED)
                      return "Calendar write access isn't granted yet. Tap Grant Phone Access and ask again.";
                  try {
                      long calId = writableCalendarId(c);
                      if (calId < 0) return "I couldn't find a writable calendar on the phone.";
                      long start = a.optLong("startMillis", 0);
                      if (start <= 0) return "That calendar action is missing a start time.";
                      long end = a.optLong("endMillis", start + 60L * 60L * 1000L);
                      ContentValues v = new ContentValues();
                      v.put(CalendarContract.Events.CALENDAR_ID, calId);
                      v.put(CalendarContract.Events.TITLE, a.optString("title", "Atlas event"));
                      v.put(CalendarContract.Events.DTSTART, start);
                      v.put(CalendarContract.Events.DTEND, end);
                      v.put(CalendarContract.Events.EVENT_TIMEZONE, TimeZone.getDefault().getID());
                      String loc = a.optString("location", "");
                      if (!loc.isEmpty()) v.put(CalendarContract.Events.EVENT_LOCATION, loc);
                      android.net.Uri u = c.getContentResolver().insert(CalendarContract.Events.CONTENT_URI, v);
                      return u != null ? "Done. I added it to your calendar." : "I couldn't add that calendar event.";
                  } catch (Exception e) { return "Calendar error: " + e.getMessage(); }
              }
          }
