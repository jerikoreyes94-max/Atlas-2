name: Build Atlas v5 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Atlas signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: atlas-personalai-debug-signing-v4

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore Atlas v5 source already stored in GitHub history
        shell: bash
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties

          python3 <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          import base64

          url = "https://raw.githubusercontent.com/jerikoreyes94-max/Atlas-2/dc1a7593b0ce1e9ab551826816b911a1ab0da9d7/.github/workflows/Atlas-v5-one-click-build.yml"

          text = urlopen(url, timeout=30).read().decode("utf-8")

          marker = "cat > /tmp/atlas-v5.b64 <<'ATLAS'"
          start = text.index(marker) + len(marker)
          end = text.index("\nATLAS", start)

          payload = "".join(text[start:end].split())

          archive = base64.b64decode(payload, validate=True)

          Path("/tmp/atlas-v5.tar.xz").write_bytes(archive)

          print("Recovered Atlas v5 source archive:", len(archive), "bytes")
          PY

          tar -xJf /tmp/atlas-v5.tar.xz

          test -f app/build.gradle
          test -f app/src/main/java/com/atlas/personalai/MainActivity.java
          test -f app/src/main/res/drawable-nodpi/atlas_icon.jpg

          grep -q "versionCode 500" app/build.gradle
          grep -q 'PREF = "atlas_v4"' app/src/main/java/com/atlas/personalai/AtlasStore.java

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          mkdir -p dist

          cp app/build/outputs/apk/debug/app-debug.apk dist/Atlas-v5.apk

          apksigner verify \
            --verbose \
            --print-certs \
            dist/Atlas-v5.apk | tee dist/signer.txt

          sha256sum dist/Atlas-v5.apk | tee dist/Atlas-v5.sha256

      - name: Save readable v5 source for v6 and later
        continue-on-error: true
        shell: bash
        run: |
          printf '.gradle/\n**/build/\nlocal.properties\n' > .gitignore

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .gitignore \
            settings.gradle \
            build.gradle \
            gradle.properties \
            app/build.gradle \
            app/src

          if git diff --cached --quiet; then
            echo "Source already stored."
            exit 0
          fi

          git commit -m "Store Atlas v5 readable source [skip ci]"

          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-v5-apk
          path: |
            dist/Atlas-v5.apk
            dist/Atlas-v5.sha256
            dist/signer.txt
          if-no-files-found: error
