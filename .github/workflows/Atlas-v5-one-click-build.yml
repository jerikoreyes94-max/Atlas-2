name: Build Atlas v5 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Atlas signing key
        id: atlas-key-cache
        uses: actions/cache/restore@v4
        with:
          path: .atlas-signing/atlas.jks
          key: atlas-personalai-signing-v5-stable

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore Atlas v5 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app
          rm -f settings.gradle
          rm -f build.gradle
          rm -f gradle.properties

          python3 <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          import base64

          url = "https://raw.githubusercontent.com/jerikoreyes94-max/Atlas-2/dc1a7593b0ce1e9ab551826816b911a1ab0da9d7/.github/workflows/Atlas-v5-one-click-build.yml"

          text = urlopen(url, timeout=30).read().decode("utf-8")

          marker = "cat > /tmp/atlas-v5.b64 <<'ATLAS'"
          start = text.index(marker) + len(marker)
          end = text.index("\nATLAS", start)

          payload = "".join(text[start:end].split())

          Path("/tmp/atlas-v5.tar.xz").write_bytes(
              base64.b64decode(payload, validate=True)
          )
          PY

          tar -xJf /tmp/atlas-v5.tar.xz

          test -f app/build.gradle
          test -f app/src/main/java/com/atlas/personalai/MainActivity.java
          test -f app/src/main/res/drawable-nodpi/atlas_icon.jpg

          grep -q "versionCode 500" app/build.gradle

      - name: Create permanent Atlas signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .atlas-signing

          if [ ! -f .atlas-signing/atlas.jks ]; then
            keytool -genkeypair \
              -keystore .atlas-signing/atlas.jks \
              -storetype PKCS12 \
              -storepass atlas-local-v5 \
              -keypass atlas-local-v5 \
              -alias atlas \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -dname "CN=Atlas Personal AI, OU=Personal, O=Atlas, C=US"
          fi

          keytool \
            -list \
            -keystore .atlas-signing/atlas.jks \
            -storepass atlas-local-v5 \
            -alias atlas

          cp app/build.gradle /tmp/atlas-build.gradle.clean

          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  atlasPersistent {
                      storeFile file("$rootDir/.atlas-signing/atlas.jks")
                      storePassword "atlas-local-v5"
                      keyAlias "atlas"
                      keyPassword "atlas-local-v5"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.atlasPersistent
                  }
              }
          }
          GRADLE

      - name: Save Atlas signing key
        if: steps.atlas-key-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .atlas-signing/atlas.jks
          key: atlas-personalai-signing-v5-stable

      - name: Build Atlas v5
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          test -f app/build/outputs/apk/debug/app-debug.apk

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            dist/Atlas-v5.apk

          test -s dist/Atlas-v5.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            dist/Atlas-v5.apk \
            | tee dist/signer.txt

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          "$AAPT" \
            dump badging \
            dist/Atlas-v5.apk \
            | tee dist/package.txt

          grep -q \
            "package: name='com.atlas.personalai'" \
            dist/package.txt

          grep -q \
            "versionCode='500'" \
            dist/package.txt

      - name: Hash APK
        shell: bash
        run: |
          sha256sum \
            dist/Atlas-v5.apk \
            | tee dist/Atlas-v5.sha256

      - name: Save readable Atlas source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cp \
            /tmp/atlas-build.gradle.clean \
            app/build.gradle

          printf \
            '.gradle/\n**/build/\nlocal.properties\n.atlas-signing/\n' \
            > .gitignore

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .gitignore \
            settings.gradle \
            build.gradle \
            gradle.properties \
            app/build.gradle \
            app/src

          if ! git diff --cached --quiet; then
            git commit \
              -m "Store readable Atlas v5 source [skip ci]"

            git push
          fi

      - name: Upload Atlas v5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-v5-apk
          path: |
            dist/Atlas-v5.apk
            dist/Atlas-v5.sha256
            dist/signer.txt
            dist/package.txt
          if-no-files-found: error
          retention-days: 30
