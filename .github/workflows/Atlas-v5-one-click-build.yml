      - name: Ensure permanent Atlas signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .atlas-signing
          if [ ! -f .atlas-signing/atlas.jks ]; then
            keytool -genkeypair \
              -keystore .atlas-signing/atlas.jks \
              -storetype PKCS12 \
              -storepass atlas-local-v5 \
              -keypass atlas-local-v5 \
              -alias atlas \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -dname "CN=Atlas Personal AI, OU=Personal, O=Atlas, C=US"
          fi
          keytool -list -keystore .atlas-signing/atlas.jks -storepass atlas-local-v5 -alias atlas

      - name: Build Atlas v7
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Atlas-v7.apk
          test -s dist/Atlas-v7.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/Atlas-v7.apk | tee dist/signer.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/Atlas-v7.apk | tee dist/package.txt
          grep -q "package: name='com.atlas.personalai'" dist/package.txt
          grep -q "versionCode='700'" dist/package.txt
          sha256sum dist/Atlas-v7.apk | tee dist/Atlas-v7.sha256

      - name: Save readable Atlas v7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore settings.gradle build.gradle gradle.properties app/build.gradle app/src
          if ! git diff --cached --quiet; then
            git commit -m "Store full Atlas v7 source [skip ci]"
            git push
          fi

      - name: Upload Atlas v7 APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-v7-apk
          path: |
            dist/Atlas-v7.apk
            dist/Atlas-v7.sha256
            dist/signer.txt
            dist/package.txt
          if-no-files-found: error
          retention-days: 30

