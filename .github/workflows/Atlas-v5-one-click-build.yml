name: Build Atlas v7 Full

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/Atlas-v7-full-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent Atlas signer
        uses: actions/cache@v4
        with:
          path: .atlas-signing/atlas.jks
          key: atlas-personalai-signing-v5-stable

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Write complete Atlas v7 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app/src/main/java/com/atlas/personalai app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable
          cat > 'settings.gradle' <<'ATLAS_FILE_1'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AtlasV7"
          include ':app'
          ATLAS_FILE_1

          cat > 'build.gradle' <<'ATLAS_FILE_2'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          ATLAS_FILE_2

          cat > 'gradle.properties' <<'ATLAS_FILE_3'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          ATLAS_FILE_3

          cat > '.gitignore' <<'ATLAS_FILE_4'
          .gradle/
          **/build/
          local.properties
          .atlas-signing/
          ATLAS_FILE_4

          cat > 'app/build.gradle' <<'ATLAS_FILE_5'
          plugins { id 'com.android.application' }
          
          android {
              namespace 'com.atlas.personalai'
              compileSdk 36
          
              defaultConfig {
                  applicationId 'com.atlas.personalai'
                  minSdk 29
                  targetSdk 36
                  versionCode 700
                  versionName '7.0.0'
              }
          
              signingConfigs {
                  atlasPersistent {
                      storeFile file("$rootDir/.atlas-signing/atlas.jks")
                      storePassword "atlas-local-v5"
                      keyAlias "atlas"
                      keyPassword "atlas-local-v5"
                  }
              }
          
              buildTypes {
                  debug {
                      signingConfig signingConfigs.atlasPersistent
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ATLAS_FILE_5

          cat > 'app/src/main/AndroidManifest.xml' <<'ATLAS_FILE_6'
